 the Metropolitan Museum of Art to look at ancient Greek and Roman stuff.", "pg": null, "page": 2}], [{"t": "I know—it sounds like torture.", "pg": null, "page": 2}, {"t": "Most Yancy field trips were.", "pg": null, "page": 2}], [{"t": "But Mr. Brunner, our Latin teacher, was leading this trip, so I had hopes.", "pg": null, "page": 2}], [{"t": "Mr. Brunner was this middle-aged guy in a motorized wheelchair.", "pg": null, "page": 2}, {"t": "He had thinning hair and a scruffy beard and a frayed tweed jacket, which always smelled like coffee.", "pg": null, "page": 2}, {"t": "You wouldn’t think he’d be cool, but he told stories and jokes and let us play games in class.", "pg": null, "page": 2}, {"t": "He also had this awesome collection of Roman armor and weapons, so he was the only teacher whose class didn’t put me to sleep.", "pg": null, "page": 2}], [{"t": "I hoped the trip would be okay.", "pg": null, "page": 2}, {"t": "At least, I hoped that for once I wouldn’t get in trouble.", "pg": null, "page": 2}], [{"t": "Boy, was I wrong.", "pg": null, "page": 2}], [{"t": "See, bad things happen to me on field trips.", "pg": null, "page": 2}, {"t": "Like at my fifth-grade school, when we went to the Saratoga battlefield, I had this accident with a Revolutionary War cannon.", "pg": null, "page": 2}, {"t": "I wasn’t aiming for the school bus, but of course I got expelled anyway.", "pg": null, "page": 2}, {"t": "And before that, at my fourth-grade school, when we took a behind-the-scenes tour of the Marine World shark pool, I sort of hit the wrong lever on the catwalk and our class took an unplanned swim.", "pg": null, "page": 2}, {"t": "And the time before that…Well, you get the idea.", "pg": 3, "page": 3}], [{"t": "This trip, I was determined to be good.", "pg": null, "page": 3}], [{"t": "All the way into the city, I put up with Nancy Bobofit, the freckly, redheaded kleptomaniac girl, hitting my best friend Grover in the back of the head with chunks of peanut butter-and-ketch   if(i>0 || playing) s.el.classList.add('on');
  $('pPage').textContent = 'p.' + s.page;
  $('pCount').textContent = `${i} / ${S.length - 1}`;
  $('fill').style.width = (i / (S.length - 1) * 100) + '%';
  if(scroll){
    const r = s.el.getBoundingClientRect();
    if(r.top < 90 || r.bottom > window.innerHeight - 170)
      window.scrollTo({top: window.scrollY + r.top - window.innerHeight * 0.35, behavior: 'smooth'});
  }
}

function pickVoice(){
  const want = store.get('voice', '');
  return voices.find(v => v.name === want) || voices[0] || null;
}
function speak(i){
  if(!synth) return;
  const my = ++token;
  synth.cancel();
  idx = i; mark(i, true); store.set('pos_' + ch.n, i);
  const u = new SpeechSynthesisUtterance(spoken(S[i].t));
  const v = pickVoice(); if(v){ u.voice = v; u.lang = v.lang; } else u.lang = 'en-US';
  u.rate = parseFloat($('rate').value);
  u.onend = () => {
    if(my !== token || !playing) return;
    if(repeat) speak(i);
    else if(i < S.length - 1) speak(i + 1);
    else { setPlaying(false); store.set('pos_' + ch.n, 0); mark(i,false); }
  };
  u.onerror = e => { if(my === token && e.error !== 'interrupted' && e.error !== 'canceled') setPlaying(false); };
  setTimeout(() => { if(my === token) synth.speak(u); }, 60);
}
function setPlaying(on){
  playing = on;
  $('icoPlay').style.display = on ? 'none' : '';
  $('icoPause').style.display = on ? '' : 'none';
  $('btnPlay').setAttribute('aria-label', on ? '일시정지' : '재생');
}
function playFrom(i){ $('resume').classList.remove('show'); setPlaying(true); speak(i); }
function stop(){ token++; if(synth) synth.cancel(); setPlaying(false); }

$('btnPlay').onclick = () => { if(playing){ stop(); mark(idx,false); } else playFrom(idx); };
$('btnPrev').onclick = () => { const i = Math.max(0, idx - 1); playing ? speak(i) : (idx = i, mark(i, true)); };
$('btnNext').onclick = () => { const i = Math.min(S.length - 1, idx + 1); playing ? speak(i) : (idx = i, mark(i, true)); };
$('btnRep').onclick = () => { repeat = !repeat; $('btnRep').classList.toggle('toggled', repeat); };
$('rate').onchange = () => { store.set('rate', $('rate').value); if(playing) speak(idx); };
$('btnResume').onclick = () => playFrom(idx);
$('track').onclick = e => {
  const r = e.currentTarget.getBoundingClientRect();
  const i = Math.round((e.clientX - r.left) / r.width * (S.length - 1));
  playing ? speak(i) : (idx = i, mark(i, true));
};
$('text').addEventListener('click', e => {
  const s = e.target.closest('.s'); if(s) playFrom(+s.dataset.i);
});

/* sheets */
let openSheet = null;
function show(id){ hide(); openSheet = $(id); openSheet.classList.add('show'); $('veil').classList.add('show'); }
function hide(){ if(openSheet) openSheet.classList.remove('show'); openSheet = null; $('veil').classList.remove('show'); }
$('veil').onclick = hide;

function sayWord(text){
  if(!synth) return;
  const wasPlaying = playing; if(wasPlaying) stop();
  synth.cancel();
  const u = new SpeechSynthesisUtterance(text); const v = pickVoice(); if(v){u.voice=v;u.lang=v.lang;} else u.lang='en-US';
  u.rate = 0.8; synth.speak(u);
}

/* settings */
function loadVoices(){
  if(!synth) return;
  const all = synth.getVoices().filter(v => /^en[-_]/i.test(v.lang) || v.lang === 'en');
  const score = v => (/en[-_]US/i.test(v.lang)?4:/en[-_]GB/i.test(v.lang)?2:0) + (/natural|neural|premium|enhanced|samantha|aria|jenny|google us/i.test(v.name)?3:0) + (v.localService?1:0);
  voices = all.sort((a,b) => score(b) - score(a));
  const sel = $('voice'); sel.innerHTML = '';
  voices.forEach(v => { const o = document.createElement('option'); o.value = v.name; o.textContent = `${v.name} (${v.lang})`; sel.appendChild(o); });
  const want = store.get('voice', ''); if(voices.some(v => v.name === want)) sel.value = want;
  if(!voices.length){ const o = document.createElement('option'); o.textContent = '영어 목소리를 찾지 못했어요'; sel.appendChild(o); }
}
if(synth){ loadVoices(); synth.onvoiceschanged = loadVoices; }
$('voice').onchange = () => { store.set('voice', $('voice').value); if(playing) speak(idx); };
$('btnTest').onclick = () => sayWord('Hi! My name is Percy Jackson. I am twelve years old.');
$('btnRestart').onclick = () => { hide(); playFrom(0); };
$('btnSet').onclick = () => show('shSet');
function setFs(px){ px = Math.max(15, Math.min(28, px)); document.documentElement.style.setProperty('--fs', px + 'px'); store.set('fs', px); }
$('fsDown').onclick = () => setFs(parseInt(getComputedStyle(document.documentElement).getPropertyValue('--fs')) - 1);
$('fsUp').onclick = () => setFs(parseInt(getComputedStyle(document.documentElement).getPropertyValue('--fs')) + 1);
if(store.get('fs', 0)) setFs(store.get('fs', 19));
$('rate').value = store.get('rate', '0.9');

document.addEventListener('visibilitychange', () => { if(document.hidden && playing){ stop(); mark(idx,false); } });

openChapter(BOOK.chapters[0].n);
</script>
</body>
</html>

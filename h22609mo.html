var storeKey = "cutop_2609_g2";
var userStore = {};

function loadStore() {
  try {
    var d = localStorage.getItem(storeKey);
    if (d) userStore = JSON.parse(d);
  } catch(e) {}
}

function saveStore() {
  try {
    localStorage.setItem(storeKey, JSON.stringify(userStore));
  } catch(e) {}
}

function getStore(w) {
  var k = w.word + "|" + w.meaning;
  return userStore[k] || {};
}

function setStore(w, key, val) {
  var k = w.word + "|" + w.meaning;
  if (!userStore[k]) userStore[k] = {};
  userStore[k][key] = val;
  saveStore();
}

function esc(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function speak(t) {
  if (!("speechSynthesis" in window)) return;
  window.speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance(t);
  u.lang = "en-US";
  u.rate = 0.85;
  window.speechSynthesis.speak(u);
}

function speakFc() {
  var el = document.getElementById("fcword");
  if (el) speak(el.textContent);
}

function buildRanges(ws) {
  var r = [{ label: "전체", s: 0, e: ws.length }];
  for (var i = 0; i < ws.length; i += 50) {
    r.push({ label: (i+1) + "-" + Math.min(i+50, ws.length), s: i, e: Math.min(i+50, ws.length) });
  }
  return r;
}

var ranges = buildRanges(rawWords);
var lri = 0, fri = 0, lFilter = "all";

function renderRangeBar(id, curIdx, fnName) {
  var el = document.getElementById(id);
  var html = "";
  ranges.forEach(function(r, idx) {
    var cls = idx === curIdx ? "r-btn active" : "r-btn";
    html += '<button class="' + cls + '" onclick="' + fnName + '(' + idx + ')">' + r.label + '</button>';
  });
  el.innerHTML = html;
}

function switchTab(t) {
  ["list","flash","quiz","test"].forEach(function(n) {
    var btn = document.getElementById("tb-" + n);
    var tab = document.getElementById("tab-" + n);
    if (btn) btn.classList.toggle("active", n === t);
    if (tab) tab.classList.toggle("active", n === t);
  });
  if (t === "list")  { renderRangeBar("lrbar", lri, "setLR"); renderList(); }
  if (t === "flash") { renderRangeBar("fcrbar", fri, "setFR"); initFC(); }
  if (t === "quiz")  { initQuiz(); }
  if (t === "test")  { renderSetup(); }
}

function setLR(idx) { lri = idx; renderRangeBar("lrbar", lri, "setLR"); renderList(); }
function setFR(idx) { fri = idx; renderRangeBar("fcrbar", fri, "setFR"); initFC(); }

function setFilter(f) {
  lFilter = f;
  ["all","unk","fav"].forEach(function(n) {
    var btn = document.getElementById("fb-" + n);
    if (btn) btn.classList.toggle("active", n === f);
  });
  renderList();
}

function renderList() {
  var container = document.getElementById("lcontainer");
  var q = document.getElementById("lsearch").value.toLowerCase().trim();
  var range = ranges[lri];
  var sub = rawWords.slice(range.s, range.e);

  var html = "";
  sub.forEach(function(w) {
    var st = getStore(w);
    var isKnown = st.status === "known";
    var isFav = !!st.fav;

    if (lFilter === "unk" && isKnown) return;
    if (lFilter === "fav" && !isFav) return;

    if (q) {
      var matchW = w.word.toLowerCase().indexOf(q) >= 0;
      var matchM = w.meaning.toLowerCase().indexOf(q) >= 0;
      if (!matchW && !matchM) return;
    }

    var cardCls = isKnown ? "word-card known" : "word-card";
    var starCls = isFav ? "ibtn star-btn active" : "ibtn star-btn";

    html += '<div class="' + cardCls + '">';
    html += '  <button class="chk-btn" data-w="' + esc(w.word) + '" data-m="' + esc(w.meaning) + '" onclick="toggleKnown(this)">' + (isKnown ? "✓" : "") + '</button>';
    html += '  <div class="card-body">';
    html += '    <div class="card-w en">' + esc(w.word) + '</div>';
    html += '    <div class="card-m">' + esc(w.meaning) + '</div>';
    html += '  </div>';
    html += '  <button class="ibtn" data-w="' + esc(w.word) + '" onclick="speak(this.dataset.w)">🔊</button>';
    html += '  <button class="' + starCls + '" data-w="' + esc(w.word) + '" data-m="' + esc(w.meaning) + '" onclick="toggleFav(this)">★</button>';
    html += '</div>';
  });

  container.innerHTML = html || '<div style="text-align:center; padding:30px; color:var(--gray);">검색 결과가 없습니다.</div>';
}

function toggleKnown(btn) {
  var w = { word: btn.dataset.w, meaning: btn.dataset.m };
  var st = getStore(w);
  setStore(w, "status", st.status === "known" ? "" : "known");
  renderList();
}

function toggleFav(btn) {
  var w = { word: btn.dataset.w, meaning: btn.dataset.m };
  var st = getStore(w);
  setStore(w, "fav", !st.fav);
  renderList();
}

var fcList = [], fcIdx = 0, fcFlipped = false, fcTX = 0;

function initFC() {
  var r = ranges[fri];
  fcList = rawWords.slice(r.s, r.e);
  fcIdx = 0;
  showFC();
}

function showFC() {
  if (!fcList.length) return;
  fcFlipped = false;
  var w = fcList[fcIdx];
  var st = getStore(w);

  document.getElementById("fcword").textContent = w.word;
  document.getElementById("fcmeaning").textContent = w.meaning;
  document.getElementById("fcmeaning").style.display = "none";

  var favBtn = document.getElementById("fcfav");
  favBtn.className = st.fav ? "ibtn star-btn fc-fav active" : "ibtn star-btn fc-fav";
  favBtn.onclick = function(e) {
    e.stopPropagation();
    setStore(w, "fav", !st.fav);
    showFC();
  };
}

function fcFlip() {
  if (fcFlipped) return;
  fcFlipped = true;
  document.getElementById("fcmeaning").style.display = "block";
  speakFc();
}

function fcNext() {
  if (fcIdx < fcList.length - 1) { fcIdx++; showFC(); }
}

function fcPrev() {
  if (fcIdx > 0) { fcIdx--; showFC(); }
}

(function(){
  var card = document.getElementById("fccard");
  if (!card) return;
  card.addEventListener("click", function(e) {
    if (e.target.id === "fcfav") return;
    fcFlip();
  });
  card.addEventListener("touchstart", function(e) {
    fcTX = e.touches[0].clientX;
  }, {passive:true});
  card.addEventListener("touchend", function(e) {
    var dx = e.changedTouches[0].clientX - fcTX;
    if (Math.abs(dx) > 50) { if (dx < 0) fcNext(); else fcPrev(); }
  }, {passive:true});
})();

var qList = [], qIdx = 0, qScore = 0, qLocked = false;

function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function initQuiz() {
  var pool = shuffle(rawWords);
  qList = pool.slice(0, Math.min(10, pool.length));
  qIdx = 0;
  qScore = 0;
  qLocked = false;
  showQuiz();
}

function showQuiz() {
  var container = document.getElementById("qarea");
  if (qIdx >= qList.length) {
    var pct = Math.round((qScore / qList.length) * 100);
    var emo = pct === 100 ? "🏆" : pct >= 80 ? "🎉" : pct >= 60 ? "👍" : "💪";
    var html = '<div class="res-card">';
    html += '<div class="res-emoji">' + emo + '</div>';
    html += '<div class="res-score">' + qScore + ' / ' + qList.length + '</div>';
    html += '<div class="res-pct">' + pct + '점</div>';
    html += '<button class="btn-main" onclick="initQuiz()">↩ 다시 풀기</button>';
    html += '</div>';
    container.innerHTML = html;
    return;
  }

  qLocked = false;
  var cur = qList[qIdx];
  var opts = [cur.meaning];
  var others = rawWords.filter(function(x){ return x.meaning !== cur.meaning; });
  others = shuffle(others).slice(0, 3);
  others.forEach(function(x){ opts.push(x.meaning); });
  opts = shuffle(opts);

  var html = '<div class="q-box"><div class="q-word en">' + esc(cur.word) + '</div></div>';
  html += '<div class="q-options">';
  opts.forEach(function(o) {
    var isCor = (o === cur.meaning) ? "1" : "0";
    html += '<button class="q-opt" data-cor="' + isCor + '" data-w="' + esc(cur.word) + '" onclick="qAns(this)">' + esc(o) + '</button>';
  });
  html += '</div>';
  container.innerHTML = html;
}

function qAns(btn) {
  if (qLocked) return;
  qLocked = true;
  var isCor = btn.dataset.cor === "1";
  if (isCor) {
    btn.classList.add("cor");
    qScore++;
    speak(btn.dataset.w);
  } else {
    btn.classList.add("wrg");
    var opts = document.querySelectorAll(".q-opt");
    for (var i=0; i<opts.length; i++) {
      if (opts[i].dataset.cor === "1") opts[i].classList.add("cor");
    }
  }
  setTimeout(function(){
    qIdx++;
    showQuiz();
  }, 1000);
}

var tName = "", tri = 0, tList = [], tIdx = 0, tCorCount = 0, tAnswers = [];

function renderSetup() {
  var container = document.getElementById("tarea");
  var html = '<div style="background:#fff; border:1px solid var(--border); border-radius:12px; padding:20px;">';
  html += '<div style="font-weight:700; margin-bottom:8px; color:#111827;">학생 이름</div>';
  html += '<input type="text" id="tname-in" class="input-field" placeholder="이름을 입력하세요" value="' + esc(tName) + '">';
  html += '<div style="font-weight:700; margin-bottom:8px; color:#111827;">시험 범위 선택</div>';
  html += '<div id="trbar" class="range-bar" style="margin-bottom:16px;"></div>';
  html += '<button class="btn-main" onclick="startTest()">테스트 시작 ▶</button>';
  html += '</div>';
  container.innerHTML = html;

  renderRangeBar("trbar", tri, "setTR");
}

function setTR(idx) { tri = idx; renderRangeBar("trbar", tri, "setTR"); }

function startTest() {
  var nameIn = document.getElementById("tname-in");
  if (!nameIn || !nameIn.value.trim()) {
    alert("이름을 입력해주세요.");
    return;
  }
  tName = nameIn.value.trim();

  var range = ranges[tri];
  var pool = rawWords.slice(range.s, range.e);
  pool = shuffle(pool);
  tList = pool.slice(0, Math.min(50, pool.length));
  tIdx = 0;
  tCorCount = 0;
  tAnswers = [];

  showTest();
}

function showTest() {
  var container = document.getElementById("tarea");
  if (tIdx >= tList.length) {
    showTestResult();
    return;
  }

  var cur = tList[tIdx];
  speak(cur.word);

  var pct = Math.round((tIdx / tList.length) * 100);
  var html = '<div class="t-stat">';
  html += '<span>문제 ' + (tIdx + 1) + ' / ' + tList.length + '</span>';
  html += '<span>✅ 맞춤: ' + tCorCount + '</span>';
  html += '</div>';
  html += '<div class="p-bar-bg"><div class="p-bar-fill" style="width:' + pct + '%;"></div></div>';
  html += '<div class="q-box" style="margin-bottom:16px;">';
  html += '<div class="q-word en">' + esc(cur.word) + '</div>';
  html += '</div>';
  html += '<input type="text" id="tinput" class="input-field" placeholder="한글 뜻 입력 후 Enter" autocomplete="off" onkeypress="handleTKp(event)">';
  html += '<button class="btn-main" onclick="submitTestAns()">다음</button>';

  container.innerHTML = html;
  setTimeout(function(){
    var inp = document.getElementById("tinput");
    if (inp) inp.focus();
  }, 50);
}

function handleTKp(e) {
  if (e.key === "Enter") submitTestAns();
}

function isSim(input, correct) {
  var norm = function(s) {
    return s.replace(/\s/g,"").replace(/[~\-·,]/g,"").toLowerCase();
  };
  var a = norm(input), c = norm(correct);
  if (!a) return false;
  if (a === c) return true;
  if (a.length >= 2 && c.indexOf(a) >= 0) return true;
  var core = c.replace(/하다|되다|시키다|이다/g,"").trim();
  if (core.length >= 2 && a.indexOf(core) >= 0) return true;
  return false;
}

function submitTestAns() {
  var inp = document.getElementById("tinput");
  if (!inp) return;
  var val = inp.value.trim();
  var cur = tList[tIdx];
  var cor = isSim(val, cur.meaning);

  if (cor) tCorCount++;
  tAnswers.push({ word: cur.word, meaning: cur.meaning, input: val, isCor: cor });

  tIdx++;
  showTest();
}

function showTestResult() {
  var container = document.getElementById("tarea");
  var total = tList.length;
  var pct = Math.round((tCorCount / total) * 100);
  var emo = pct === 100 ? "🏆" : pct >= 80 ? "🎉" : pct >= 60 ? "👍" : "💪";

  var errs = tAnswers.filter(function(x){ return !x.isCor; });

  var html = '<div class="res-card">';
  html += '<div class="res-emoji">' + emo + '</div>';
  html += '<div class="res-score">' + tCorCount + ' / ' + total + '</div>';
  html += '<div class="res-pct">' + pct + '점</div>';

  if (errs.length > 0) {
    html += '<div class="err-list">';
    errs.forEach(function(e) {
      html += '<div class="err-item">';
      html += '<strong class="en">' + esc(e.word) + '</strong><br>';
      html += '<span style="color:var(--danger)">입력: ' + esc(e.input || "(빈칸)") + '</span> / ';
      html += '<span style="color:var(--success)">정답: ' + esc(e.meaning) + '</span>';
      html += '</div>';
    });
    html += '</div>';
  }

  html += '<button class="btn-share" onclick="copyResult()">📋 카톡으로 결과 복사</button>';
  html += '<button class="btn-main" style="background:#E5E7EB; color:#374151;" onclick="renderSetup()">↩ 다시 테스트</button>';
  html += '</div>';

  container.innerHTML = html;
}

function copyResult() {
  var d = new Date();
  var dateStr = d.getFullYear() + "-" + pad2(d.getMonth()+1) + "-" + pad2(d.getDate());
  var total = tList.length;
  var pct = Math.round((tCorCount / total) * 100);

  var errs = tAnswers.filter(function(x){ return !x.isCor; });
  var cors = tAnswers.filter(function(x){ return x.isCor; });

  var txt = "[씨유에탑 2609 고2 모고 어휘] 테스트 결과\n";
  txt += "날짜: " + dateStr + "\n";
  txt += "이름: " + tName + "\n";
  txt += "점수: " + tCorCount + "/" + total + " (" + pct + "점)\n";
  txt += "─────────────────\n";
  
  if (errs.length > 0) {
    txt += "❌ 틀린 단어 (" + errs.length + "개)\n";
    errs.forEach(function(e) {
      txt += "  " + e.word + " → 입력:" + (e.input || "(빈칸)") + " / 정답:" + e.meaning + "\n";
    });
    txt += "─────────────────\n";
  }

  var corWords = cors.map(function(c){ return c.word; }).join(", ");
  txt += "✅ 맞은 단어: " + (corWords || "없음");

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(function(){
      alert("결과가 클립보드에 복사되었습니다!");
    });
  } else {
    var ta = document.createElement("textarea");
    ta.value = txt;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
    alert("결과가 클립보드에 복사되었습니다!");
  }
}

function pad2(n) { return n < 10 ? "0" + n : n; }

loadStore();
renderRangeBar("lrbar", lri, "setLR");
renderList();
</script>

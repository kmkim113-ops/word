{ num:"101", title:"주어를 부사로 해석해야 하는 구문", note:"무생물주어 구문 — 사물/사건 주어를 '~ 때문에, ~ 덕분에'처럼 부사적으로 해석", sentences:[

];

const CH = { code:"chapter16", title:"Chapter 16", desc:"특수구문", solid:"#111827" };

/* ===================== 상태 ===================== */
const appState = {
  name: "",
  unitIdx: null,
  items: [],
  idx: 0,
  marks: [],
  revealed: false,
  userAnswer: "",
  wrongPool: false,
  completed: new Set()
};

function el(id){ return document.getElementById(id); }
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}

function parseUnit(u){
  return u.sentences.map(line=>{
    const [en,ko,level] = line.split("|");
    return {en,ko,level};
  });
}

function goHome(){
  appState.unitIdx = null;
  appState.wrongPool = false;
  render();
}

function startUnit(i){
  appState.unitIdx = i;
  appState.items = parseUnit(UNITS[i]);
  appState.idx = 0;
  appState.marks = new Array(appState.items.length).fill(null);
  appState.revealed = false;
  appState.userAnswer = "";
  appState.wrongPool = false;
  renderPracticeView();
}

function checkAnswer(){
  appState.userAnswer = el("answerInput").value;
  appState.revealed = true;
  renderPracticeView();
}

function mark(value){
  appState.marks[appState.idx] = value;
  if(appState.idx < appState.items.length - 1){
    appState.idx += 1;
    appState.revealed = false;
    appState.userAnswer = "";
    renderPracticeView();
  } else {
    if(!appState.wrongPool) appState.completed.add(appState.unitIdx);
    renderResultView();
  }
}

function retryWrong(){
  const wrongItems = appState.items.filter((_,i)=>appState.marks[i]==="x");
  if(wrongItems.length === 0) return;
  appState.wrongPool = true;
  appState.items = wrongItems;
  appState.idx = 0;
  appState.marks = new Array(wrongItems.length).fill(null);
  appState.revealed = false;
  appState.userAnswer = "";
  renderPracticeView();
}

function copyResult(){
  const total = appState.marks.length;
  const correct = appState.marks.filter(x=>x==="o").length;
  const wrong = total - correct;
  const unit = UNITS[appState.unitIdx];
  const text = "📘 " + CH.title + " · " + CH.desc + " 결과\n" +
    "이름: " + (appState.name || "이름 미입력") + "\n" +
    "Unit " + unit.num + " · " + unit.title + (appState.wrongPool ? " (오답 복습)" : "") + "\n" +
    "날짜: " + new Date().toLocaleDateString('ko-KR') + "\n" +
    "정답: " + correct + " / " + total + "\n" +
    "오답: " + wrong + " / " + total;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(showCopied).catch(()=>fallbackCopy(text));
  } else { fallbackCopy(text); }
}

function fallbackCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position='fixed'; ta.style.left='-9999px';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); showCopied(); }
  catch(e){ alert('복사에 실패했어요. 아래 텍스트를 직접 선택해 복사해주세요.\n\n' + text); }
  document.body.removeChild(ta);
}

function showCopied(){
  const btn = el("copyBtn");
  if(!btn) return;
  const old = btn.innerText;
  btn.innerText = "복사되었습니다 ✓";
  setTimeout(()=>{ btn.innerText = old; }, 1800);
}

/* ===================== 렌더 ===================== */
function render(){
  if(appState.unitIdx === null) renderHome();
  else renderPracticeView();
}

function renderHome(){
  const doneCount = appState.completed.size;
  let html = `
    <header class="top">
      <div><p class="eyebrow">SENTENCE PATTERN LAB</p><h1>씨유에탑 구문독해</h1><p class="chline">${CH.title} · ${CH.desc}</p></div>
    </header>
    <div class="card">
      <p class="label">이름 (선택 · 결과 복사에 표시돼요)</p>
      <input type="text" id="nameInput" placeholder="예: 홍길동" value="${escapeHtml(appState.name)}" oninput="appState.name=this.value">
      <div class="progresscard" style="margin-top:14px;">
        <div>
          <p class="label" style="margin-bottom:0;">전체 진행률</p>
          <p style="font-weight:900;font-size:18px;">${doneCount} / ${UNITS.length} Unit 완료</p>
        </div>
        <div class="pct">${Math.round((doneCount/UNITS.length)*100)}%</div>
      </div>
      ${UNITS.map((u,i)=>{
        const isDone = appState.completed.has(i);
        const firstIncomplete = UNITS.findIndex((_,j)=>!appState.completed.has(j));
        const isUnlocked = isDone || i === (firstIncomplete === -1 ? UNITS.length : firstIncomplete);
        const isCurrent = !isDone && i === firstIncomplete;
        return `<div class="unititem ${!isUnlocked ? 'locked':''} ${isCurrent?'current':''}" onclick="${isUnlocked ? `startUnit(${i})` : ''}">
          <div>
            <div class="unumber">UNIT ${u.num}</div>
            <div class="utitle">${u.title}</div>
            <div class="ucount">${u.sentences.length}문장 · ${u.note}</div>
          </div>
          <div class="badge" style="background:${isDone?'#E5E7EB':'transparent'};color:${CH.solid}">${isDone ? '✓' : (isUnlocked ? '›' : '🔒')}</div>
        </div>`;
      }).join("")}
    </div>
    <p class="note">여기까지 오셨다면 Chapter 2~16 전 과정 완주예요. 마지막까지 화이팅!</p>
  `;
  el("app").innerHTML = html;
}

function renderPracticeView(){
  const unit = UNITS[appState.unitIdx];
  const sentence = appState.items[appState.idx];
  const pct = Math.round((appState.idx / appState.items.length) * 100);
  const correctSoFar = appState.marks.filter(x=>x==="o").length;
  const wrongSoFar = appState.marks.filter(x=>x==="x").length;

  let html = `
    <header class="top">
      <div><p class="eyebrow">SENTENCE PATTERN LAB</p><h1>씨유에탑 구문독해</h1><p class="chline">${CH.title} · ${CH.desc}</p></div>
      <button class="homebtn" onclick="goHome()">홈</button>
    </header>
    <div class="progressbar"><div style="width:${pct}%"></div></div>
    <div class="card">
      <div class="toprow">
        <span class="pill">UNIT ${unit.num} · ${unit.title}${appState.wrongPool ? ' · 오답 복습' : ''}</span>
        <span class="pillmuted">${sentence.level}</span>
        <span class="tally">${appState.idx+1} / ${appState.items.length} · 정답 ${correctSoFar} 오답 ${wrongSoFar}</span>
      </div>
      <p class="sentence">${escapeHtml(sentence.en)}</p>
      <textarea id="answerInput" placeholder="이 문장을 우리말로 해석해서 적어보세요" ${appState.revealed ? "disabled" : ""}>${appState.revealed ? escapeHtml(appState.userAnswer) : ""}</textarea>
  `;
  if(!appState.revealed){
    html += `<button class="primarybtn" onclick="checkAnswer()">정답 확인</button>`;
  } else {
    html += `
      <div class="answerbox">
        <p class="lbl">모범 해석</p>
        <p class="val">${escapeHtml(sentence.ko)}</p>
      </div>
      <p class="hint">내가 쓴 해석과 비교해서 스스로 채점해주세요</p>
      <div class="btnrow">
        <button onclick="mark('x')">다시 볼게요</button>
        <button class="wide" onclick="mark('o')">맞았어요</button>
      </div>
    `;
  }
  html += `</div>`;
  el("app").innerHTML = html;
}

function renderResultView(){
  const unit = UNITS[appState.unitIdx];
  const total = appState.marks.length;
  const correct = appState.marks.filter(x=>x==="o").length;
  const wrong = total - correct;
  const nextIdx = appState.unitIdx + 1;

  let html = `
    <header class="top">
      <div><p class="eyebrow">SENTENCE PATTERN LAB</p><h1>씨유에탑 구문독해</h1><p class="chline">${CH.title} · ${CH.desc}</p></div>
      <button class="homebtn" onclick="goHome()">홈</button>
    </header>
    <div class="card resultcard">
      <p class="pillmuted" style="display:inline-block;">UNIT ${unit.num} · ${unit.title}${appState.wrongPool ? ' (오답 복습)' : ''}</p>
      <p class="score">${correct} / ${total}</p>
      <p class="sub">정답 ${correct}개 · 오답 ${wrong}개</p>
      <div class="reviewlist">
        <p class="rv-label">문장별 결과</p>
        ${appState.items.map((it,i)=>`
          <div class="reviewitem">
            <span class="reviewbadge ${appState.marks[i]==='o'?'ok':'ng'}">${appState.marks[i]==='o'?'O':'X'}</span>
            <div>
              <p class="rv-en">${escapeHtml(it.en)}</p>
              <p class="rv-ko">${escapeHtml(it.ko)}</p>
            </div>
          </div>
        `).join("")}
      </div>
      <div style="text-align:left;margin-top:18px;">
        <div class="metarow"><span>이름</span><span>${appState.name ? escapeHtml(appState.name) : "미입력"}</span></div>
        <div class="metarow"><span>Unit</span><span>${unit.num} · ${unit.title}</span></div>
        <div class="metarow"><span>날짜</span><span>${new Date().toLocaleDateString('ko-KR')}</span></div>
      </div>
      <div class="stack">
        <button id="copyBtn" class="solid" onclick="copyResult()">📋 결과 복사하기 (카톡 붙여넣기용)</button>
        ${wrong>0 ? `<button onclick="retryWrong()">오답 ${wrong}개만 다시 풀기</button>` : ""}
        ${(!appState.wrongPool && nextIdx < UNITS.length) ? `<button style="border-color:${CH.solid};color:${CH.solid}" onclick="startUnit(${nextIdx})">다음 Unit (${UNITS[nextIdx].num}) 풀기</button>` : ""}
        <button onclick="goHome()">처음 화면으로</button>
      </div>
    </div>
  `;
  el("app").innerHTML = html;
}

render();
</script>
</body>
</html>

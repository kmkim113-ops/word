<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>고2 26년 6월 모의고사 2회 — 청킹 해석 훈련</title>
<style>
  :root{
    --navy:#182a4d;
    --navy-2:#24365c;
    --cream:#f6f2e8;
    --paper:#fffdf8;
    --ink:#242021;
    --ink-soft:#5a5450;
    --amber:#c98a3b;
    --amber-2:#e0a458;
    --line:#e4dcc9;
    --ok:#3f7d5c;
    --ok-bg:#e7f2eb;
    --bad:#b5453a;
    --bad-bg:#faeae8;
    --lock:#bdb6a6;
    --radius:14px;
    --serif: "Noto Serif KR","Nanum Myeongjo","Apple SD Gothic Neo",serif;
    --sans: "Pretendard","Apple SD Gothic Neo","Malgun Gothic","Segoe UI",sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:var(--sans);
    line-height:1.6;
    min-height:100vh;
  }
  .wrap{max-width:760px;margin:0 auto;padding:28px 18px 80px;}

  /* header */
  .masthead{
    border-bottom:3px solid var(--navy);
    padding-bottom:18px;
    margin-bottom:28px;
  }
  .masthead .eyebrow{
    font-size:12px;
    letter-spacing:.18em;
    color:var(--amber);
    font-weight:700;
    text-transform:uppercase;
  }
  .masthead h1{
    font-family:var(--serif);
    font-size:28px;
    margin:6px 0 4px;
    color:var(--navy);
    letter-spacing:-0.01em;
  }
  .masthead p{margin:0;color:var(--ink-soft);font-size:14px;}

  .name-box{
    margin-top:16px;
    display:flex;
    gap:8px;
    align-items:center;
    flex-wrap:wrap;
  }
  .name-box label{font-size:13px;color:var(--ink-soft);}
  .name-box input{
    border:1px solid var(--line);
    background:var(--paper);
    border-radius:8px;
    padding:7px 10px;
    font-size:14px;
    font-family:var(--sans);
    color:var(--ink);
    min-width:140px;
  }
  .name-box input:focus{outline:2px solid var(--amber-2);outline-offset:1px;}

  /* stage map */
  .map-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
    margin-bottom:10px;
  }
  @media (min-width:520px){
    .map-grid{grid-template-columns:repeat(4,1fr);}
  }
  .unit-card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px 12px;
    text-align:center;
    cursor:pointer;
    position:relative;
    transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease;
  }
  .unit-card:hover:not(.locked){
    transform:translateY(-2px);
    box-shadow:0 6px 16px rgba(24,42,77,0.1);
    border-color:var(--amber-2);
  }
  .unit-card .num{
    font-family:var(--serif);
    font-size:26px;
    color:var(--navy);
    font-weight:700;
  }
  .unit-card .lv{
    font-size:11px;
    color:var(--ink-soft);
    margin-top:4px;
  }
  .unit-card .status{
    margin-top:8px;
    font-size:11px;
    font-weight:700;
    letter-spacing:.03em;
  }
  .unit-card .status.done{color:var(--ok);}
  .unit-card .status.ready{color:var(--amber);}
  .unit-card .status.locked{color:var(--lock);}
  .unit-card.locked{cursor:not-allowed;opacity:.55;}
  .unit-card .lock-icon{position:absolute;top:8px;right:10px;font-size:13px;color:var(--lock);}
  .unit-card .check-icon{position:absolute;top:8px;right:10px;font-size:13px;color:var(--ok);}

  .map-note{font-size:12.5px;color:var(--ink-soft);margin-top:14px;margin-bottom:6px;}

  /* unit view */
  .unit-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:18px;
    gap:10px;
  }
  .back-btn{
    background:none;border:none;color:var(--navy);font-size:14px;cursor:pointer;
    font-weight:600;padding:6px 0;display:flex;align-items:center;gap:5px;
  }
  .back-btn:hover{color:var(--amber);}
  .unit-title-block{text-align:right;}
  .unit-title-block .tag{
    font-size:11px;color:var(--amber);font-weight:700;letter-spacing:.05em;
  }
  .unit-title-block h2{
    font-family:var(--serif);font-size:20px;margin:2px 0 0;color:var(--navy);
  }

  .progress-strip{
    display:flex;gap:6px;margin-bottom:22px;
  }
  .progress-strip .seg{
    flex:1;height:5px;border-radius:3px;background:var(--line);
  }
  .progress-strip .seg.active{background:var(--amber-2);}
  .progress-strip .seg.done{background:var(--navy);}

  .card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:18px 18px 20px;
    margin-bottom:14px;
  }
  .card .idx{
    display:inline-block;
    font-size:11px;
    font-weight:700;
    color:#fff;
    background:var(--navy);
    border-radius:5px;
    padding:2px 7px;
    margin-bottom:10px;
  }
  .card .source-en{
    font-size:15.5px;
    line-height:1.65;
    color:var(--ink);
    margin-bottom:12px;
  }
  .card .en-word{
    font-family:var(--serif);
    font-size:17px;
    color:var(--navy);
    font-weight:700;
  }
  textarea, input[type=text]{
    width:100%;
    border:1px solid var(--line);
    border-radius:9px;
    padding:9px 11px;
    font-family:var(--sans);
    font-size:14.5px;
    color:var(--ink);
    background:#fffefc;
    resize:vertical;
  }
  textarea:focus, input[type=text]:focus{outline:2px solid var(--amber-2);outline-offset:1px;}
  textarea{min-height:52px;}

  .reveal-box{
    margin-top:12px;
    padding:12px 13px;
    background:var(--cream);
    border-left:3px solid var(--amber-2);
    border-radius:6px;
    font-size:14.5px;
    display:none;
  }
  .reveal-box.shown{display:block;}
  .reveal-box .label{font-size:11px;color:var(--amber);font-weight:700;margin-bottom:4px;letter-spacing:.03em;}

  .btn-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center;}
  .btn{
    border:none;border-radius:8px;padding:9px 16px;font-size:13.5px;font-weight:700;
    cursor:pointer;font-family:var(--sans);transition:opacity .12s ease, transform .1s ease;
  }
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--navy);color:#fff;}
  .btn-primary:hover{background:var(--navy-2);}
  .btn-ghost{background:transparent;color:var(--navy);border:1px solid var(--line);}
  .btn-ghost:hover{border-color:var(--navy);}
  .btn-amber{background:var(--amber-2);color:#2a2016;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}

  .self-grade{display:flex;gap:8px;margin-top:12px;}
  .grade-btn{
    flex:1;border-radius:8px;border:1.5px solid var(--line);background:#fff;
    padding:9px;font-weight:700;cursor:pointer;font-size:13.5px;font-family:var(--sans);
    color:var(--ink-soft);
  }
  .grade-btn.o.picked{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);}
  .grade-btn.x.picked{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);}

  .bottom-bar{
    position:sticky;bottom:0;
    background:linear-gradient(to top, var(--cream) 70%, transparent);
    padding-top:18px;margin-top:6px;
  }
  .bottom-bar .btn{width:100%;padding:13px;font-size:15px;}

  /* result */
  .score-panel{
    display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px;
  }
  .score-box{
    background:var(--navy);color:#fff;border-radius:var(--radius);
    padding:18px 14px;text-align:center;
  }
  .score-box .n{font-family:var(--serif);font-size:30px;font-weight:700;}
  .score-box .l{font-size:12px;opacity:.8;margin-top:2px;}

  .section-label{
    font-family:var(--serif);font-size:16px;color:var(--navy);
    margin:24px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--line);
  }
  .wrong-item{
    background:var(--paper);border:1px solid var(--line);border-radius:10px;
    padding:12px 14px;margin-bottom:10px;
  }
  .wrong-item .en{font-size:14px;color:var(--ink);margin-bottom:8px;}
  .wrong-item .compare{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .wrong-item .compare div{font-size:13px;padding:7px 9px;border-radius:6px;}
  .wrong-item .mine{background:var(--bad-bg);color:#7a352c;}
  .wrong-item .model{background:var(--ok-bg);color:#2e5c42;}
  .wrong-item .compare .k{font-size:10.5px;font-weight:700;display:block;margin-bottom:3px;letter-spacing:.03em;}
  .empty-note{font-size:13.5px;color:var(--ink-soft);padding:10px 2px;}

  /* full passage with chunk marks */
  .passage-card{
    background:var(--navy);
    color:#f3efe2;
    border-radius:var(--radius);
    padding:18px 18px 16px;
    margin-bottom:20px;
  }
  .passage-card .plabel{
    font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--amber-2);font-weight:700;margin-bottom:12px;
  }
  .passage-flow{
    display:flex;flex-wrap:wrap;align-items:center;gap:7px 3px;
  }
  .passage-flow .cchunk{
    display:inline-flex;align-items:baseline;gap:5px;
    padding:5px 9px;border-radius:7px;
    background:rgba(224,164,88,0.14);
    line-height:1.55;
  }
  .passage-flow .cchunk.alt{background:rgba(224,164,88,0.26);}
  .passage-flow .cnum{
    font-size:9.5px;font-weight:800;color:var(--navy);
    background:var(--amber-2);border-radius:4px;padding:0 4px;
    flex-shrink:0;
  }
  .passage-flow .ctxt{font-size:14px;color:#f3efe2;}
  .passage-flow .cdiv{color:var(--amber-2);font-weight:700;font-size:15px;}

  .copy-area{margin-top:26px;}
  .copy-status{font-size:12.5px;color:var(--ok);margin-top:8px;display:none;}
  .copy-status.shown{display:inline-block;}

  footer{
    text-align:center;color:var(--ink-soft);font-size:12px;margin-top:40px;
  }
</style>
</head>
<body>

  currentStage:0,   // 0 vocab, 1 chunk, 2 result
};
state.unitProgress.forEach(p=>{ p.vocabMarks=[]; p.chunkMarks=[]; p.vocabInputs=[]; p.chunkInputs=[]; });

const app = document.getElementById('app');

function isUnlocked(i){
  if(i===0) return true;
  return state.unitProgress[i-1].completed;
}

/* ================= RENDER: MAP ================= */
function renderMap(){
  state.currentUnit=-1;
  let cardsHtml = UNITS.map((u,i)=>{
    const unlocked = isUnlocked(i);
    const done = state.unitProgress[i].completed;
    let statusHtml, icon="";
    if(done){ statusHtml = `<div class="status done">완료</div>`; icon=`<span class="check-icon">✓</span>`; }
    else if(unlocked){ statusHtml = `<div class="status ready">도전 가능</div>`; }
    else { statusHtml = `<div class="status locked">잠김</div>`; icon=`<span class="lock-icon">🔒</span>`; }
    return `
      <div class="unit-card ${unlocked?'':'locked'}" data-unit="${i}">
        ${icon}
        <div class="num">${u.id}</div>
        <div class="lv">${u.level}</div>
        ${statusHtml}
      </div>`;
  }).join('');

  app.innerHTML = `
    <div class="masthead">
      <div class="eyebrow">Chunk Reading Lab</div>
      <h1>${SET_TITLE}</h1>
      <p>${SET_SUBTITLE}</p>
      <div class="name-box">
        <label for="nameInput">이름(선택):</label>
        <input type="text" id="nameInput" placeholder="예: 홍길동" value="${state.userName}">
      </div>
    </div>
    <div class="map-grid">${cardsHtml}</div>
    <div class="map-note">지문을 순서대로 완료하면 다음 지문이 열립니다. 각 지문은 어휘 → 해석 → 결과 3단계로 진행됩니다.</div>
    <footer>총 ${UNITS.length}개 지문 · 어휘·해석 자기 채점형 학습 도구</footer>
  `;

  document.getElementById('nameInput').addEventListener('input', e=>{
    state.userName = e.target.value;
  });

  document.querySelectorAll('.unit-card').forEach(el=>{
    el.addEventListener('click', ()=>{
      const i = parseInt(el.dataset.unit,10);
      if(!isUnlocked(i)) return;
      openUnit(i);
    });
  });
}

/* ================= OPEN UNIT ================= */
function openUnit(i){
  state.currentUnit = i;
  const p = state.unitProgress[i];
  if(p.vocabInputs.length===0){
    p.vocabInputs = UNITS[i].vocab.map(()=>"");
    p.vocabMarks = UNITS[i].vocab.map(()=>null);
    p.chunkInputs = UNITS[i].chunks.map(()=>"");
    p.chunkMarks = UNITS[i].chunks.map(()=>null);
  }
  state.currentStage = p.vocabDone ? (p.chunkDone ? 2 : 1) : 0;
  renderUnit();
}

function progressStripHtml(){
  const stage = state.currentStage;
  const seg = (idx)=> idx<stage ? 'done' : (idx===stage?'active':'');
  return `
    <div class="progress-strip">
      <div class="seg ${seg(0)}"></div>
      <div class="seg ${seg(1)}"></div>
      <div class="seg ${seg(2)}"></div>
    </div>`;
}

function unitHeaderHtml(u){
  return `
    <div class="unit-header">
      <button class="back-btn" id="toMapBtn">← 목록으로</button>
      <div class="unit-title-block">
        <div class="tag">${u.source}</div>
        <h2>${u.id}번 지문 · ${u.level}</h2>
      </div>
    </div>`;
}

function attachBackBtn(){
  document.getElementById('toMapBtn').addEventListener('click', renderMap);
}

/* ================= RENDER: UNIT (dispatch by stage) ================= */
function renderUnit(){
  if(state.currentStage===0) renderVocabStage();
  else if(state.currentStage===1) renderChunkStage();
  else renderResultStage();
}

/* -------- Stage 0: Vocabulary -------- */
function renderVocabStage(){
  const i = state.currentUnit;
  const u = UNITS[i];
  const p = state.unitProgress[i];

  const itemsHtml = u.vocab.map((v,idx)=>{
    const marked = p.vocabMarks[idx];
    return `
    <div class="card">
      <span class="idx">어휘 ${idx+1}</span>
      <div class="en-word">${v.w}</div>
      <textarea data-vidx="${idx}" class="vocab-input" placeholder="뜻을 입력해 보세요" ${p.vocabRevealed?'disabled':''}>${p.vocabInputs[idx]}</textarea>
      <div class="reveal-box ${p.vocabRevealed?'shown':''}">
        <div class="label">모범 뜻</div>
        ${v.m}
      </div>
      ${p.vocabRevealed ? `
      <div class="self-grade">
        <button class="grade-btn o ${marked==='O'?'picked':''}" data-vgrade="O" data-vidx="${idx}">O 맞았어요</button>
        <button class="grade-btn x ${marked==='X'?'picked':''}" data-vgrade="X" data-vidx="${idx}">X 틀렸어요</button>
      </div>` : ``}
    </div>`;
  }).join('');

  app.innerHTML = `
    ${unitHeaderHtml(u)}
    ${progressStripHtml()}
    <h3 style="font-family:var(--serif);color:var(--navy);margin:0 0 4px;">1단계 · 핵심 어휘</h3>
    <p style="color:var(--ink-soft);font-size:13.5px;margin-top:0;margin-bottom:18px;">뜻을 먼저 적어본 뒤 모범 뜻을 확인하고, 스스로 O/X로 채점하세요.</p>
    ${itemsHtml}
    <div class="bottom-bar">
      ${!p.vocabRevealed
        ? `<button class="btn btn-primary" id="revealVocabBtn">모범 뜻 확인하기</button>`
        : `<button class="btn btn-amber" id="nextToChunkBtn" ${p.vocabMarks.some(m=>m===null)?'disabled':''}>해석 단계로 이동 →</button>`
      }
    </div>
  `;

  attachBackBtn();

  document.querySelectorAll('.vocab-input').forEach(el=>{
    el.addEventListener('input', e=>{
      p.vocabInputs[parseInt(e.target.dataset.vidx,10)] = e.target.value;
    });
  });

  const revealBtn = document.getElementById('revealVocabBtn');
  if(revealBtn){
    revealBtn.addEventListener('click', ()=>{
      p.vocabRevealed = true;
      renderVocabStage();
    });
  }

  document.querySelectorAll('[data-vgrade]').forEach(el=>{
    el.addEventListener('click', e=>{
      const idx = parseInt(e.target.dataset.vidx,10);
      p.vocabMarks[idx] = e.target.dataset.vgrade;
      renderVocabStage();
    });
  });

  const nextBtn = document.getElementById('nextToChunkBtn');
  if(nextBtn){
    nextBtn.addEventListener('click', ()=>{
      p.vocabDone = true;
      state.currentStage = 1;
      renderUnit();
    });
  }
}

/* -------- Stage 1: Chunk interpretation -------- */
function renderChunkStage(){
  const i = state.currentUnit;
  const u = UNITS[i];
  const p = state.unitProgress[i];

  const itemsHtml = u.chunks.map((c,idx)=>{
    const marked = p.chunkMarks[idx];
    return `
    <div class="card">
      <span class="idx">청크 ${idx+1}</span>
      <div class="source-en">${c.en}</div>
      <textarea data-cidx="${idx}" class="chunk-input" placeholder="해석을 입력해 보세요" ${p.chunkRevealed?'disabled':''}>${p.chunkInputs[idx]}</textarea>
      <div class="reveal-box ${p.chunkRevealed?'shown':''}">
        <div class="label">모범 해석</div>
        ${c.ko}
      </div>
      ${p.chunkRevealed ? `
      <div class="self-grade">
        <button class="grade-btn o ${marked==='O'?'picked':''}" data-cgrade="O" data-cidx="${idx}">O 맞았어요</button>
        <button class="grade-btn x ${marked==='X'?'picked':''}" data-cgrade="X" data-cidx="${idx}">X 틀렸어요</button>
      </div>` : ``}
    </div>`;
  }).join('');

  const passageFlowHtml = u.chunks.map((c,idx)=>{
    const altClass = idx%2===1 ? ' alt' : '';
    const chunk = `<span class="cchunk${altClass}"><span class="cnum">${idx+1}</span><span class="ctxt">${c.en}</span></span>`;
    return chunk;
  }).join(`<span class="cdiv">／</span>`);

  app.innerHTML = `
    ${unitHeaderHtml(u)}
    ${progressStripHtml()}
    <h3 style="font-family:var(--serif);color:var(--navy);margin:0 0 4px;">2단계 · 청킹 해석</h3>
    <p style="color:var(--ink-soft);font-size:13.5px;margin-top:0;margin-bottom:18px;">각 의미 단위(청크)를 자연스러운 한글로 해석해 본 뒤 모범 해석과 비교하세요.</p>

    <div class="passage-card">
      <div class="plabel">지문 전체 · 청크 구분(／) 표시</div>
      <div class="passage-flow">${passageFlowHtml}</div>
    </div>

    ${itemsHtml}
    <div class="bottom-bar">
      ${!p.chunkRevealed
        ? `<button class="btn btn-primary" id="revealChunkBtn">모범 해석 확인하기</button>`
        : `<button class="btn btn-amber" id="toResultBtn" ${p.chunkMarks.some(m=>m===null)?'disabled':''}>결과 확인하기 →</button>`
      }
    </div>
  `;

  attachBackBtn();

  document.querySelectorAll('.chunk-input').forEach(el=>{
    el.addEventListener('input', e=>{
      p.chunkInputs[parseInt(e.target.dataset.cidx,10)] = e.target.value;
    });
  });

  const revealBtn = document.getElementById('revealChunkBtn');
  if(revealBtn){
    revealBtn.addEventListener('click', ()=>{
      p.chunkRevealed = true;
      renderChunkStage();
    });
  }

  document.querySelectorAll('[data-cgrade]').forEach(el=>{
    el.addEventListener('click', e=>{
      const idx = parseInt(e.target.dataset.cidx,10);
      p.chunkMarks[idx] = e.target.dataset.cgrade;
      renderChunkStage();
    });
  });

  const toResultBtn = document.getElementById('toResultBtn');
  if(toResultBtn){
    toResultBtn.addEventListener('click', ()=>{
      p.chunkDone = true;
      p.completed = true;
      state.currentStage = 2;
      renderUnit();
    });
  }
}

/* -------- Stage 2: Result -------- */
function renderResultStage(){
  const i = state.currentUnit;
  const u = UNITS[i];
  const p = state.unitProgress[i];

  const vocabScore = p.vocabMarks.filter(m=>m==='O').length;
  const chunkScore = p.chunkMarks.filter(m=>m==='O').length;

  const wrongVocab = u.vocab.map((v,idx)=>({...v, idx})).filter((v)=>p.vocabMarks[v.idx]==='X');
  const wrongChunk = u.chunks.map((c,idx)=>({...c, idx})).filter((c)=>p.chunkMarks[c.idx]==='X');

  const wrongVocabHtml = wrongVocab.length ? wrongVocab.map(v=>`
    <div class="wrong-item">
      <div class="en" style="font-family:var(--serif);font-size:15px;color:var(--navy);">${v.w}</div>
      <div class="compare">
        <div class="mine"><span class="k">내가 쓴 뜻</span>${p.vocabInputs[v.idx] || '(입력 안 함)'}</div>
        <div class="model"><span class="k">모범 뜻</span>${v.m}</div>
      </div>
    </div>`).join('') : `<div class="empty-note">틀린 어휘가 없습니다 🎉</div>`;

  const wrongChunkHtml = wrongChunk.length ? wrongChunk.map(c=>`
    <div class="wrong-item">
      <div class="en">${c.en}</div>
      <div class="compare">
        <div class="mine"><span class="k">내가 쓴 해석</span>${p.chunkInputs[c.idx] || '(입력 안 함)'}</div>
        <div class="model"><span class="k">모범 해석</span>${c.ko}</div>
      </div>
    </div>`).join('') : `<div class="empty-note">틀린 해석이 없습니다 🎉</div>`;

  const nextIdx = i+1;
  const hasNext = nextIdx < UNITS.length;

  app.innerHTML = `
    ${unitHeaderHtml(u)}
    ${progressStripHtml()}
    <h3 style="font-family:var(--serif);color:var(--navy);margin:0 0 16px;">3단계 · 결과</h3>

    <div class="score-panel">
      <div class="score-box">
        <div class="n">${vocabScore} / ${u.vocab.length}</div>
        <div class="l">어휘 점수</div>
      </div>
      <div class="score-box">
        <div class="n">${chunkScore} / ${u.chunks.length}</div>
        <div class="l">해석 점수</div>
      </div>
    </div>

    <div class="section-label">틀린 어휘 (${wrongVocab.length}개)</div>
    ${wrongVocabHtml}
    ${wrongVocab.length ? `<button class="btn btn-ghost" id="retryVocabBtn">틀린 어휘만 다시 풀기</button>` : ``}

    <div class="section-label">틀린 해석 (${wrongChunk.length}개)</div>
    ${wrongChunkHtml}
    ${wrongChunk.length ? `<button class="btn btn-ghost" id="retryChunkBtn" style="margin-top:${wrongVocab.length?'10px':'0'};">틀린 해석만 다시 풀기</button>` : ``}

    <div class="copy-area">
      <button class="btn btn-primary" id="copyBtn">결과 복사하기</button>
      <span class="copy-status" id="copyStatus">복사되었습니다 ✓</span>
    </div>

    <div class="bottom-bar" style="margin-top:26px;">
      ${hasNext
        ? `<button class="btn btn-amber" id="nextUnitBtn">다음 지문(${UNITS[nextIdx].id}번)으로 →</button>`
        : `<button class="btn btn-amber" id="finishAllBtn">전체 목록으로 돌아가기</button>`
      }
    </div>
  `;

  attachBackBtn();

  const retryVocabBtn = document.getElementById('retryVocabBtn');
  if(retryVocabBtn){
    retryVocabBtn.addEventListener('click', ()=>{
      wrongVocab.forEach(v=>{
        p.vocabMarks[v.idx]=null;
        p.vocabInputs[v.idx]="";
      });
      p.vocabRevealed=false;
      state.currentStage=0;
      renderUnit();
    });
  }
  const retryChunkBtn = document.getElementById('retryChunkBtn');
  if(retryChunkBtn){
    retryChunkBtn.addEventListener('click', ()=>{
      wrongChunk.forEach(c=>{
        p.chunkMarks[c.idx]=null;
        p.chunkInputs[c.idx]="";
      });
      p.chunkRevealed=false;
      state.currentStage=1;
      renderUnit();
    });
  }

  document.getElementById('copyBtn').addEventListener('click', ()=>{
    const text = buildCopyText(i);
    copyToClipboard(text, ()=>{
      const s = document.getElementById('copyStatus');
      s.classList.add('shown');
      setTimeout(()=>s.classList.remove('shown'), 2500);
    });
  });

  const nextUnitBtn = document.getElementById('nextUnitBtn');
  if(nextUnitBtn){
    nextUnitBtn.addEventListener('click', ()=> openUnit(nextIdx));
  }
  const finishAllBtn = document.getElementById('finishAllBtn');
  if(finishAllBtn){
    finishAllBtn.addEventListener('click', renderMap);
  }
}

function buildCopyText(i){
  const u = UNITS[i];
  const p = state.unitProgress[i];
  const vocabScore = p.vocabMarks.filter(m=>m==='O').length;
  const chunkScore = p.chunkMarks.filter(m=>m==='O').length;
  const name = state.userName ? state.userName : "(이름 미입력)";

  let lines = [];
  lines.push(`[${SET_TITLE}] ${u.id}번 지문 결과`);
  lines.push(`이름: ${name}`);
  lines.push(`어휘 점수: ${vocabScore} / ${u.vocab.length}`);
  lines.push(`해석 점수: ${chunkScore} / ${u.chunks.length}`);
  lines.push('');

  const wrongVocab = u.vocab.map((v,idx)=>({...v, idx})).filter(v=>p.vocabMarks[v.idx]==='X');
  const wrongChunk = u.chunks.map((c,idx)=>({...c, idx})).filter(c=>p.chunkMarks[c.idx]==='X');

  lines.push(`- 틀린 어휘 (${wrongVocab.length}개) -`);
  if(wrongVocab.length===0){ lines.push('없음'); }
  else{
    wrongVocab.forEach(v=>{
      lines.push(`· ${v.w}`);
      lines.push(`  내가 쓴 뜻: ${p.vocabInputs[v.idx] || '(입력 안 함)'}`);
      lines.push(`  모범 뜻: ${v.m}`);
    });
  }
  lines.push('');
  lines.push(`- 틀린 해석 (${wrongChunk.length}개) -`);
  if(wrongChunk.length===0){ lines.push('없음'); }
  else{
    wrongChunk.forEach(c=>{
      lines.push(`· ${c.en}`);
      lines.push(`  내가 쓴 해석: ${p.chunkInputs[c.idx] || '(입력 안 함)'}`);
      lines.push(`  모범 해석: ${c.ko}`);
    });
  }
  return lines.join('\n');
}

function copyToClipboard(text, onSuccess){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(onSuccess).catch(()=>fallbackCopy(text, onSuccess));
  } else {
    fallbackCopy(text, onSuccess);
  }
}
function fallbackCopy(text, onSuccess){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position='fixed';
  ta.style.left='-9999px';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  try{ document.execCommand('copy'); onSuccess(); }catch(e){ /* ignore */ }
  document.body.removeChild(ta);
}

/* ================= INIT ================= */
renderMap();
</script>
</body>
</html>

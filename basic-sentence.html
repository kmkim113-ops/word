  textarea:disabled { background:#F8FAFC; }
  .primarybtn { width:100%; margin-top:16px; padding:14px; border:none; border-radius:12px; font-weight:800; font-size:15px; color:#fff; cursor:pointer; }
  .primarybtn:disabled { background:#CBD5E1 !important; cursor:not-allowed; }

  .answerbox .val { font-weight:800; font-size:16px; }
  .userbox { background:#F8FAFC; border:1px solid #E2E8F0; border-radius:12px; padding:14px; margin-bottom:10px; }
  .hint { font-size:12px; color:#94A3B8; margin:10px 0 8px; }

  .metarow { display:flex; justify-content:space-between; font-size:13px; padding:10px 0; border-bottom:1px solid #F1F5F9; }
  .metarow:last-child { border-bottom:none; }
  .metarow span:first-child { color:#94A3B8; }
  .metarow span:last-child { font-weight:700; }
  .stack { display:flex; flex-direction:column; gap:10px; margin-top:18px; }
  .stack button { padding:14px; border-radius:12px; font-weight:800; cursor:pointer; border:1px solid #E2E8F0; background:#fff; }

  .reviewitem { display:flex; gap:10px; align-items:flex-start; padding:10px 0; border-bottom:1px solid #F1F1F1; }

  .reviewbadge { flex-shrink:0; width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; margin-top:2px; }

  .note { font-size:12px; color:#94A3B8; text-align:center; margin-top:16px; line-height:1.6; }

  return DATA[f].map(line=>{
    const [en,ko,level] = line.split("|");
    return {en,ko,level};
  });
}

/* ===================== 상태 ===================== */
const appState = {
  name: "",
  format: null,
  setNum: null,
  items: [],
  idx: 0,
  marks: [],
  revealed: false,
  userAnswer: "",
  wrongPool: null // {format,setNum,items} when in "오답만 다시" mode
};

function el(id){ return document.getElementById(id); }

function goHome(){
  appState.format = null;
  appState.setNum = null;
  appState.wrongPool = null;
  render();
}

function selectFormat(f){
  appState.format = f;
  render();
}

function backToFormats(){
  appState.format = null;
  render();
}

const SET_SIZE = 10;

function startPractice(setNum){
  appState.setNum = setNum;
  const all = parseFormat(appState.format);
  appState.items = all.slice((setNum-1)*SET_SIZE, setNum*SET_SIZE);
  appState.idx = 0;
  appState.marks = new Array(appState.items.length).fill(null);
  appState.revealed = false;
  appState.userAnswer = "";
  appState.wrongPool = null;
  renderPracticeView();
}

function checkAnswer(){
  const val = el("answerInput").value;
  appState.userAnswer = val;
  appState.revealed = true;
  renderPracticeView();
}

function mark(value){
  appState.marks[appState.idx] = value;
  if(appState.idx < appState.items.length - 1){
    appState.idx += 1;
    appState.revealed = false;
    appState.userAnswer = "";
    renderPracticeView();
  } else {
    renderResultView();
  }
}

function retryWrong(){
  const wrongItems = appState.items.filter((_,i)=>appState.marks[i]==="x");
  if(wrongItems.length === 0) return;
  appState.wrongPool = true;
  appState.items = wrongItems;
  appState.idx = 0;
  appState.marks = new Array(wrongItems.length).fill(null);
  appState.revealed = false;
  appState.userAnswer = "";
  renderPracticeView();
}

function copyResult(){
  const total = appState.marks.length;
  const correct = appState.marks.filter(x=>x==="o").length;
  const wrong = total - correct;
  const meta = FORMAT_META[appState.format];
  const setLabel = appState.wrongPool ? "오답 복습" : `Set ${appState.setNum} (${(appState.setNum-1)*SET_SIZE+1}~${Math.min(appState.setNum*SET_SIZE,100)})`;
  const text = "📘 씨유에탑 기초형식 해석하기 결과\n" +
    "이름: " + (appState.name || "이름 미입력") + "\n" +
    "형식: " + meta.name + " · " + meta.desc + "\n" +
    "범위: " + setLabel + "\n" +
    "날짜: " + new Date().toLocaleDateString('ko-KR') + "\n" +
    "정답: " + correct + " / " + total + "\n" +
    "오답: " + wrong + " / " + total;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(showCopied).catch(()=>fallbackCopy(text));
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); showCopied(); }
  catch(e){ alert('복사에 실패했어요. 아래 텍스트를 직접 선택해 복사해주세요.\n\n' + text); }
  document.body.removeChild(ta);
}

function showCopied(){
  const btn = el("copyBtn");
  if(!btn) return;
  const old = btn.innerText;
  btn.innerText = "복사되었습니다 ✓";
  setTimeout(()=>{ btn.innerText = old; }, 1800);
}

/* ===================== 렌더 ===================== */
function render(){
  if(!appState.format){
    renderHomeFormats();
  } else {
    renderHomeSets();
  }
}

function renderHomeFormats(){
  let html = `
    <header class="top">
      <div><p class="eyebrow">SENTENCE PATTERN LAB</p><h1>씨유에탑 기초형식 해석하기</h1></div>
    </header>
    <div class="card">
      <p class="label">이름 (선택 · 결과 복사에 표시돼요)</p>
      <input type="text" id="nameInput" placeholder="예: 홍길동" value="${escapeHtml(appState.name)}" oninput="appState.name=this.value">
      <p class="label" style="margin-bottom:10px;">형식을 선택하세요 (형식당 100문제 · 10문제씩 10세트)</p>
      <div class="grid5">
        ${[1,2,3,4,5].map(f=>{
          const m = FORMAT_META[f];
          return `<button class="fmtbtn" onclick="selectFormat(${f})">
            <div><span class="dot" style="background:${m.solid}"></span><span class="fmtname">${m.name}</span><div class="fmtdesc">${m.desc}</div></div>
            <span style="color:#CBD5E1;font-size:20px;">›</span>
          </button>`;
        }).join("")}
      </div>
    </div>
    <p class="note">단문 위주로 먼저 연습하고, 장문 독해는 별도 과제로 활용해보세요.</p>
  `;
  el("app").innerHTML = html;
}

function renderHomeSets(){
  const m = FORMAT_META[appState.format];
  const all = parseFormat(appState.format);
  const totalSets = Math.ceil(all.length / SET_SIZE);
  const setButtons = Array.from({length: totalSets}, (_, i) => i + 1).map(setNum => {
    const start = (setNum - 1) * SET_SIZE;
    const end = Math.min(setNum * SET_SIZE, all.length);
    const slice = all.slice(start, end);
    const levels = [...new Set(slice.map(x => x.level))];
    const levelLabel = levels.length > 1 ? `${levels[0]}~${levels[levels.length - 1]}` : levels[0];
    return `<div class="setbtn" onclick="startPractice(${setNum})">Set ${setNum}<small>${start + 1}~${end}번 · ${levelLabel}</small></div>`;
  }).join("");
  let html = `
    <header class="top">
      <div><p class="eyebrow">SENTENCE PATTERN LAB</p><h1>씨유에탑 기초형식 해석하기</h1></div>
    </header>
    <span class="backlink" onclick="backToFormats()">‹ 형식 다시 선택</span>
    <div class="card">
      <div class="toprow">
        <span class="pill" style="background:${m.bg};color:${m.text}">${m.name}</span>
        <span class="pillmuted">${m.desc}</span>
      </div>
      <p class="label" style="margin-top:10px;">세트를 선택하세요 (10문제씩 ${totalSets}세트)</p>
      <div class="setgrid">
        ${setButtons}
      </div>
    </div>
  `;
  el("app").innerHTML = html;
}

function renderPracticeView(){
  const m = FORMAT_META[appState.format];
  const sentence = appState.items[appState.idx];
  const pct = Math.round(((appState.idx) / appState.items.length) * 100);
  const correctSoFar = appState.marks.filter(x=>x==="o").length;
  const wrongSoFar = appState.marks.filter(x=>x==="x").length;

  let html = `
    <header class="top">
      <div><p class="eyebrow">SENTENCE PATTERN LAB</p><h1>씨유에탑 기초형식 해석하기</h1></div>
      <button class="homebtn" onclick="goHome()">홈</button>
    </header>
    <div class="progressbar"><div style="width:${pct}%;background:${m.solid}"></div></div>
    <div class="card">
      <div class="toprow">
        <span class="pill" style="background:${m.bg};color:${m.text}">${m.name}${appState.wrongPool ? ' · 오답 복습' : ''}</span>
        <span class="pillmuted">${sentence.level}</span>
        <span class="tally">${appState.idx+1} / ${appState.items.length} · 정답 ${correctSoFar} 오답 ${wrongSoFar}</span>
      </div>
      <p class="sentence">${escapeHtml(sentence.en)}</p>
      <textarea id="answerInput" placeholder="이 문장을 우리말로 해석해서 적어보세요" ${appState.revealed ? "disabled" : ""}>${appState.revealed ? escapeHtml(appState.userAnswer) : ""}</textarea>
  `;

  if(!appState.revealed){
    html += `<button class="primarybtn" style="background:${m.solid}" onclick="checkAnswer()">정답 확인</button>`;
  } else {
    html += `
      <div class="answerbox" style="background:${m.bg}">
        <p class="lbl" style="color:${m.text}">모범 해석</p>
        <p class="val" style="color:${m.text}">${escapeHtml(sentence.ko)}</p>
      </div>
      <p class="hint">내가 쓴 해석과 비교해서 스스로 채점해주세요</p>
      <div class="btnrow">
        <button onclick="mark('x')">다시 볼게요</button>
        <button class="wide" style="background:${m.solid}" onclick="mark('o')">맞았어요</button>
      </div>
    `;
  }
  html += `</div>`;
  el("app").innerHTML = html;
}

function renderResultView(){
  const m = FORMAT_META[appState.format];
  const total = appState.marks.length;
  const correct = appState.marks.filter(x=>x==="o").length;
  const wrong = total - correct;
  const setLabel = appState.wrongPool ? "오답 복습" : `Set ${appState.setNum} (${(appState.setNum-1)*SET_SIZE+1}~${Math.min(appState.setNum*SET_SIZE,100)})`;
  const totalSets = Math.ceil(100 / SET_SIZE);

  let html = `
    <header class="top">
      <div><p class="eyebrow">SENTENCE PATTERN LAB</p><h1>씨유에탑 기초형식 해석하기</h1></div>
      <button class="homebtn" onclick="goHome()">홈</button>
    </header>
    <div class="card resultcard">
      <p class="pillmuted" style="display:inline-block;">${m.name} · ${setLabel}</p>
      <p class="score" style="color:${m.solid}">${correct} / ${total}</p>
      <p class="sub">정답 ${correct}개 · 오답 ${wrong}개</p>
      <div class="reviewlist">
        <p class="rv-label">문장별 결과</p>
        ${appState.items.map((it,i)=>`
          <div class="reviewitem">
            <span class="reviewbadge ${appState.marks[i]==='o'?'ok':'ng'}">${appState.marks[i]==='o'?'O':'X'}</span>
            <div>
              <p class="rv-en">${escapeHtml(it.en)}</p>
              <p class="rv-ko">${escapeHtml(it.ko)}</p>
            </div>
          </div>
        `).join("")}
      </div>
      <div style="text-align:left;margin-top:18px;">
        <div class="metarow"><span>이름</span><span>${appState.name ? escapeHtml(appState.name) : "미입력"}</span></div>
        <div class="metarow"><span>형식</span><span>${m.name}</span></div>
        <div class="metarow"><span>범위</span><span>${setLabel}</span></div>
        <div class="metarow"><span>날짜</span><span>${new Date().toLocaleDateString('ko-KR')}</span></div>
      </div>
      <div class="stack">
        <button id="copyBtn" class="solid" style="background:#1E2A3A" onclick="copyResult()">📋 결과 복사하기 (카톡 붙여넣기용)</button>
        ${wrong>0 ? `<button onclick="retryWrong()">오답 ${wrong}개만 다시 풀기</button>` : ""}
        ${(!appState.wrongPool && appState.setNum < totalSets) ? `<button style="border-color:${m.solid};color:${m.solid}" onclick="startPractice(${appState.setNum+1})">다음 세트 (Set ${appState.setNum+1}) 풀기</button>` : ""}
        <button onclick="goHome()">처음 화면으로</button>
      </div>
    </div>
  `;
  el("app").innerHTML = html;
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}

render();
</script>
</body>
</html>

<style>
:root {
  --primary: #2563EB;
  --primary-dark: #1D4ED8;
  --primary-light: #EFF6FF;
  --success: #10B981;
  --danger: #EF4444;
  --warn: #F59E0B;
  --gray: #6B7280;
  --border: #E5E7EB;
  --bg: #F9FAFB;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans KR', sans-serif; -webkit-tap-highlight-color: transparent; }
.en { font-family: 'Nunito', sans-serif; }
body { background: #111827; display: flex; justify-content: center; min-height: 100vh; }
#app { width: 100%; max-width: 420px; background: var(--bg); min-height: 100vh; display: flex; flex-direction: column; position: relative; box-shadow: 0 0 20px rgba(0,0,0,0.3); }

/* Header */
.header { background: #fff; padding: 16px 20px; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
.header-brand { font-size: 18px; font-weight: 800; color: var(--primary); }
.header-sub { font-size: 13px; color: var(--gray); margin-top: 2px; }

/* Navigation */
.nav-tabs { display: flex; background: #fff; border-bottom: 1px solid var(--border); }
.nav-btn { flex: 1; padding: 12px 0; text-align: center; font-size: 13px; font-weight: 700; color: var(--gray); background: none; border: none; border-bottom: 2px solid transparent; cursor: pointer; }
.nav-btn.active { color: var(--primary); border-bottom-color: var(--primary); }

/* Content */
.tab-content { display: none; flex: 1; padding: 16px; flex-direction: column; }
.tab-content.active { display: flex; }

/* Range & Controls */
.rbar { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 12px; scrollbar-width: none; }
.rbar::-webkit-scrollbar { display: none; }
.rbtn { padding: 6px 12px; font-size: 12px; font-weight: 600; background: #fff; border: 1px solid var(--border); border-radius: 16px; white-space: nowrap; cursor: pointer; color: var(--gray); }
.rbtn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

.search-box { width: 100%; padding: 10px 14px; font-size: 14px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 10px; outline: none; background: #fff; }
.filter-bar { display: flex; gap: 6px; margin-bottom: 14px; }
.fbtn { flex: 1; padding: 8px; font-size: 12px; font-weight: 700; background: #fff; border: 1px solid var(--border); border-radius: 6px; cursor: pointer; color: var(--gray); }
.fbtn.active { background: var(--primary-light); color: var(--primary); border-color: var(--primary); }

/* List View */
.w-list { display: flex; flex-direction: column; gap: 10px; }
.w-card { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; transition: opacity 0.2s; }
.w-card.known { opacity: 0.35; }
.w-left { display: flex; align-items: center; gap: 10px; flex: 1; }
.chk-btn { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--border); background: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #fff; flex-shrink: 0; }
.w-card.known .chk-btn { background: var(--success); border-color: var(--success); }
.w-info { flex: 1; }
.w-eng { font-size: 16px; font-weight: 700; color: #111827; margin-bottom: 2px; }
.w-kor { font-size: 13px; color: #4B5563; }
.w-actions { display: flex; gap: 4px; }
.ibtn { background: none; border: none; font-size: 18px; cursor: pointer; padding: 4px; border-radius: 4px; }

/* Flashcard */
.fc-wrap { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; }
.fc-card { width: 100%; height: 260px; background: #fff; border: 1px solid var(--border); border-radius: 16px; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); cursor: pointer; text-align: center; margin-bottom: 20px; }
.fc-fav { position: absolute; top: 16px; right: 16px; font-size: 22px; background: none; border: none; cursor: pointer; }
.fc-eng { font-size: 26px; font-weight: 800; color: #111827; }
.fc-kor { font-size: 18px; font-weight: 600; color: var(--primary); margin-top: 14px; display: none; }
.fc-card.flipped .fc-kor { display: block; }
.fc-hint { position: absolute; bottom: 16px; font-size: 12px; color: var(--gray); }
.fc-nav { display: flex; gap: 10px; width: 100%; }
.fc-nav-btn { flex: 1; padding: 14px; font-size: 15px; font-weight: 700; color: #fff; background: var(--primary); border: none; border-radius: 10px; cursor: pointer; text-align: center; }
.fc-nav-btn.sec { background: var(--gray); }

/* Quiz */
.q-card { background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 20px; text-align: center; margin-bottom: 16px; }
.q-num { font-size: 12px; font-weight: 700; color: var(--primary); margin-bottom: 8px; }
.q-word { font-size: 24px; font-weight: 800; color: #111827; }
.q-opts { display: flex; flex-direction: column; gap: 10px; }
.q-opt { width: 100%; padding: 14px; font-size: 14px; font-weight: 600; background: #fff; border: 1px solid var(--border); border-radius: 10px; text-align: left; cursor: pointer; color: #374151; }
.q-opt.correct { background: #D1FAE5; border-color: var(--success); color: #065F46; }
.q-opt.wrong { background: #FEE2E2; border-color: var(--danger); color: #991B1B; }

/* Test & Common Result */
.form-group { margin-bottom: 16px; }
.form-label { font-size: 13px; font-weight: 700; color: #374151; margin-bottom: 6px; display: block; }
.form-input { width: 100%; padding: 12px; font-size: 14px; border: 1px solid var(--border); border-radius: 8px; outline: none; background: #fff; }
.btn-primary { width: 100%; padding: 14px; font-size: 15px; font-weight: 700; color: #fff; background: var(--primary); border: none; border-radius: 10px; cursor: pointer; }

.t-prog { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; font-weight: 700; color: var(--gray); }
.p-bar-bg { width: 100%; height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; margin-bottom: 16px; }
.p-bar-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.3s; }
.t-card { background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 24px 20px; text-align: center; margin-bottom: 16px; }
.t-word { font-size: 26px; font-weight: 800; color: #111827; margin-bottom: 16px; }

.res-card { background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 24px; text-align: center; margin-bottom: 16px; }
.res-emoji { font-size: 48px; margin-bottom: 8px; }
.res-score { font-size: 28px; font-weight: 800; color: #111827; }
.res-sub { font-size: 14px; color: var(--gray); margin-top: 4px; margin-bottom: 16px; }

.wrong-list { max-height: 200px; overflow-y: auto; text-align: left; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 16px; font-size: 13px; }
.wrong-item { margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
.wrong-item:last-child { margin-bottom: 0; padding-bottom: 0; border: none; }
.w-item-w { font-weight: 700; color: var(--danger); }
.w-item-i { color: #9CA3AF; text-decoration: line-through; margin: 0 4px; }
.w-item-c { color: var(--success); font-weight: 600; }

<div id="app">

    <div class="header-brand en">씨유에탑 ✦ 영어단어장</div>
    <div class="header-sub">문현고2 중간고사 · 총 1004단어</div>

    <button id="tb-test" class="nav-btn" onclick="switchTab('test')">📝 테스트</button>
  </div>

  <!-- TAB 1: LIST -->

      <button id="fb-fav" class="fbtn" onclick="setFilter('fav')">⭐ 즐겨찾기</button>
    </div>
    <div id="wlist" class="w-list"></div>
  </div>

  <!-- TAB 2: FLASHCARD -->
  <div id="tab-flash" class="tab-content">
    <div id="fcrbar" class="rbar"></div>
    <div class="fc-wrap">
      <div id="fccard" class="fc-card">
        <button id="fcfav" class="fc-fav" onclick="toggleFcFav(event)">☆</button>
        <div id="fcword" class="fc-eng en"></div>
        <div id="fcmeaning" class="fc-kor"></div>
        <div class="fc-hint">카드 터치시 뜻 공개 / 좌우 스와이프 이동</div>
      </div>
      <div class="fc-nav">
        <button class="fc-nav-btn sec" onclick="fcPrev()">◀ 이전</button>
        <button class="fc-nav-btn" style="background:var(--warn);" onclick="speakFc()">🔊</button>
        <button class="fc-nav-btn" onclick="fcNext()">다음 ▶</button>
      </div>
    </div>
  </div>

  <!-- TAB 3: QUIZ -->
  <div id="tab-quiz" class="tab-content">
    <div id="qarea"></div>
  </div>

  <!-- TAB 4: TEST -->
  <div id="tab-test" class="tab-content">
    <div id="tarea"></div>
  </div>
</div>

  return st[k] || { status: "", fav: false };
}

function updateItemState(w, key, val) {
  var st = getStore();
  var k = w.word + "|" + w.meaning;
  if (!st[k]) st[k] = { status: "", fav: false };
  st[k][key] = val;
  setStore(st);
}

function buildRanges(ws) {
  var r = [{ label: "전체", s: 0, e: ws.length }];
  for (var i = 0; i < ws.length; i += 50) {
    r.push({ label: (i+1) + "-" + Math.min(i+50, ws.length), s: i, e: Math.min(i+50, ws.length) });
  }
  return r;
}
var ranges = buildRanges(rawWords);

var lri = 0, fri = 0, tri = 0;
var listFilter = "all";

function esc(s) {
  return String(s)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}

function speak(t) {
  if (!("speechSynthesis" in window)) return;
  window.speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance(t);
  u.lang = "en-US";
  u.rate = 0.85;
  window.speechSynthesis.speak(u);
}
function speakFc() {
  speak(document.getElementById("fcword").textContent);
}

function switchTab(t) {
  ["list","flash","quiz","test"].forEach(function(n) {
    document.getElementById("tb-"+n).classList.toggle("active", n===t);
    document.getElementById("tab-"+n).classList.toggle("active", n===t);
  });
  if (t==="list")  { renderRangeBar("lrbar", lri, "setLR"); renderList(); }
  if (t==="flash") { renderRangeBar("fcrbar", fri, "setFR"); initFC(); }
  if (t==="quiz")  { initQuiz(); }
  if (t==="test")  { renderSetup(); }
}

function renderRangeBar(elId, activeIdx, fnName) {
  var el = document.getElementById(elId);
  var html = "";
  ranges.forEach(function(r, idx) {
    var cls = "rbtn" + (idx === activeIdx ? " active" : "");
    html += '<button class="' + cls + '" onclick="' + fnName + '(' + idx + ')">' + r.label + '</button>';
  });
  el.innerHTML = html;
}

function setLR(idx) { lri = idx; renderRangeBar("lrbar", lri, "setLR"); renderList(); }
function setFR(idx) { fri = idx; renderRangeBar("fcrbar", fri, "setFR"); initFC(); }
function setTR(idx) { tri = idx; renderRangeBar("trbar", tri, "setTR"); }

function setFilter(f) {
  listFilter = f;
  ["all","unknown","fav"].forEach(function(n) {
    document.getElementById("fb-"+n).classList.toggle("active", n===f);
  });
  renderList();
}

function toggleKnown(idx) {
  var w = rawWords[idx];
  var st = getItemState(w);
  updateItemState(w, "status", st.status === "known" ? "" : "known");
  renderList();
}

function toggleFav(idx) {
  var w = rawWords[idx];
  var st = getItemState(w);
  updateItemState(w, "fav", !st.fav);
  renderList();
}

function renderList() {
  var r = ranges[lri];
  var sub = rawWords.slice(r.s, r.e);
  var q = document.getElementById("lsearch").value.trim().toLowerCase();
  var container = document.getElementById("wlist");
  var html = "";

  sub.forEach(function(w, realIdx) {
    var idx = r.s + realIdx;
    var st = getItemState(w);

    if (q) {
      if (w.word.toLowerCase().indexOf(q) === -1 && w.meaning.toLowerCase().indexOf(q) === -1) return;
    }
    if (listFilter === "unknown" && st.status === "known") return;
    if (listFilter === "fav" && !st.fav) return;

    var knownCls = st.status === "known" ? " known" : "";
    var chkTxt = st.status === "known" ? "✓" : "";
    var starTxt = st.fav ? "★" : "☆";

    html += '<div class="w-card' + knownCls + '">';
    html += '  <div class="w-left">';
    html += '    <button class="chk-btn" onclick="toggleKnown(' + idx + ')">' + chkTxt + '</button>';
    html += '    <div class="w-info">';
    html += '      <div class="w-eng en">' + esc(w.word) + '</div>';
    html += '      <div class="w-kor">' + esc(w.meaning) + '</div>';
    html += '    </div>';
    html += '  </div>';
    html += '  <div class="w-actions">';
    html += '    <button class="ibtn" data-w="' + esc(w.word) + '" onclick="speak(this.dataset.w)">🔊</button>';
    html += '    <button class="ibtn" onclick="toggleFav(' + idx + ')">' + starTxt + '</button>';
    html += '  </div>';
    html += '</div>';
  });

  container.innerHTML = html || '<div style="text-align:center; padding:20px; color:var(--gray);">검색 결과가 없습니다.</div>';
}

/* TAB 2: FLASHCARD */
var fcList = [];
var fcIdx = 0;
var fcFlipped = false;
var fcTX = 0;

function initFC() {
  var r = ranges[fri];
  fcList = rawWords.slice(r.s, r.e);
  fcIdx = 0;
  showFC();
}

function showFC() {
  if (!fcList.length) return;
  fcFlipped = false;
  var card = document.getElementById("fccard");
  card.classList.remove("flipped");
  var w = fcList[fcIdx];
  var st = getItemState(w);

  document.getElementById("fcword").textContent = w.word;
  document.getElementById("fcmeaning").textContent = w.meaning;
  document.getElementById("fcfav").textContent = st.fav ? "★" : "☆";
}

function fcFlip() {
  var card = document.getElementById("fccard");
  card.classList.toggle("flipped");
  if (!fcFlipped) {
    fcFlipped = true;
    speakFc();
  }
}

function fcNext() {
  if (fcIdx < fcList.length - 1) { fcIdx++; showFC(); }
}
function fcPrev() {
  if (fcIdx > 0) { fcIdx--; showFC(); }
}

function toggleFcFav(e) {
  e.stopPropagation();
  var w = fcList[fcIdx];
  var st = getItemState(w);
  updateItemState(w, "fav", !st.fav);
  showFC();
}

(function(){
  var card = document.getElementById("fccard");
  card.addEventListener("click", function(e) {
    if (e.target.id === "fcfav") return;
    fcFlip();
  });
  card.addEventListener("touchstart", function(e) {
    fcTX = e.touches[0].clientX;
  }, {passive:true});
  card.addEventListener("touchend", function(e) {
    var dx = e.changedTouches[0].clientX - fcTX;
    if (Math.abs(dx) > 50) { if (dx < 0) fcNext(); else fcPrev(); }
  }, {passive:true});
})();

/* TAB 3: QUIZ */
var qList = [];
var qIdx = 0;
var qScore = 0;
var qLocked = false;

function initQuiz() {
  var pool = rawWords.slice();
  shuffle(pool);
  qList = pool.slice(0, Math.min(10, pool.length));
  qIdx = 0;
  qScore = 0;
  qLocked = false;
  showQuiz();
}

function showQuiz() {
  if (qIdx >= qList.length) { renderQuizResult(); return; }
  qLocked = false;
  var curr = qList[qIdx];
  
  var opts = [curr.meaning];
  var otherPool = rawWords.filter(function(x){ return x.word !== curr.word; });
  shuffle(otherPool);
  for (var i = 0; i < 3 && i < otherPool.length; i++) {
    opts.push(otherPool[i].meaning);
  }
  shuffle(opts);

  var html = '';
  html += '<div class="q-card">';
  html += '  <div class="q-num">QUESTION ' + (qIdx + 1) + ' / ' + qList.length + '</div>';
  html += '  <div class="q-word en">' + esc(curr.word) + '</div>';
  html += '</div>';
  html += '<div class="q-opts">';
  opts.forEach(function(o) {
    var isCor = (o === curr.meaning) ? "1" : "0";
    html += '<button class="q-opt" data-cor="' + isCor + '" onclick="qAns(this)">' + esc(o) + '</button>';
  });
  html += '</div>';

  document.getElementById("qarea").innerHTML = html;
}

function qAns(btn) {
  if (qLocked) return;
  qLocked = true;

  var isCor = btn.getAttribute("data-cor") === "1";
  if (isCor) {
    btn.classList.add("correct");
    qScore++;
    speak(qList[qIdx].word);
  } else {
    btn.classList.add("wrong");
    var all = document.querySelectorAll(".q-opt");
    for (var i = 0; i < all.length; i++) {
      if (all[i].getAttribute("data-cor") === "1") all[i].classList.add("correct");
    }
  }

  setTimeout(function() {
    qIdx++;
    showQuiz();
  }, 1000);
}

function renderQuizResult() {
  var pct = Math.round((qScore / qList.length) * 100);
  var emoji = pct === 100 ? "🏆" : pct >= 80 ? "🎉" : pct >= 60 ? "👍" : "💪";

  var html = '';
  html += '<div class="res-card">';
  html += '  <div class="res-emoji">' + emoji + '</div>';
  html += '  <div class="res-score">' + qScore + ' / ' + qList.length + ' (' + pct + '점)</div>';
  html += '  <div class="res-sub">퀴즈 완료!</div>';
  html += '  <button class="btn-primary" onclick="initQuiz()">↩ 다시 풀기</button>';
  html += '</div>';

  document.getElementById("qarea").innerHTML = html;
}

/* TAB 4: TEST */
var tName = "";
var tList = [];
var tIdx = 0;
var tScore = 0;
var tWrong = [];
var tCorrectNames = [];

function renderSetup() {
  var html = '';
  html += '<div class="form-group">';
  html += '  <label class="form-label">학생 이름</label>';
  html += '  <input type="text" id="tname" class="form-input" placeholder="이름을 입력하세요" value="' + esc(tName) + '">';
  html += '</div>';
  html += '<div class="form-group">';
  html += '  <label class="form-label">테스트 범위</label>';
  html += '  <div id="trbar" class="rbar"></div>';
  html += '</div>';
  html += '<button class="btn-primary" onclick="startTest()">테스트 시작 ▶</button>';

  document.getElementById("tarea").innerHTML = html;
  renderRangeBar("trbar", tri, "setTR");
}

function startTest() {
  var nameInp = document.getElementById("tname").value.trim();
  if (!nameInp) { alert("이름을 입력해주세요."); return; }
  tName = nameInp;

  var r = ranges[tri];
  var pool = rawWords.slice(r.s, r.e);
  shuffle(pool);
  tList = pool.slice(0, Math.min(50, pool.length));
  
  tIdx = 0;
  tScore = 0;
  tWrong = [];
  tCorrectNames = [];

  showTestQuestion();
}

function showTestQuestion() {
  if (tIdx >= tList.length) { renderTestResult(); return; }
  var curr = tList[tIdx];
  speak(curr.word);

  var pct = Math.round((tIdx / tList.length) * 100);

  var html = '';
  html += '<div class="t-prog">';
  html += '  <span>문제 ' + (tIdx + 1) + ' / ' + tList.length + '</span>';
  html += '  <span>✅ 맞춤 ' + tScore + '</span>';
  html += '</div>';
  html += '<div class="p-bar-bg"><div class="p-bar-fill" style="width:' + pct + '%"></div></div>';
  
  html += '<div class="t-card">';
  html += '  <div class="t-word en">' + esc(curr.word) + '</div>';
  html += '  <input type="text" id="tinput" class="form-input" placeholder="한글 뜻 입력 후 Enter" autocomplete="off" onkeydown="handleTestKey(event)">';
  html += '  <button class="btn-primary" style="margin-top:12px;" onclick="submitTestAns()">다음</button>';
  html += '</div>';

  document.getElementById("tarea").innerHTML = html;
  setTimeout(function(){
    var inp = document.getElementById("tinput");
    if (inp) inp.focus();
  }, 50);
}

function handleTestKey(e) {
  if (e.key === "Enter") submitTestAns();
}

function isSim(input, correct) {
  var norm = function(s) {
    return s.replace(/\s/g,"").replace(/[~\-·,]/g,"").toLowerCase();
  };
  var a = norm(input), c = norm(correct);
  if (a === c) return true;
  if (a.length >= 2 && c.indexOf(a) >= 0) return true;
  var core = c.replace(/하다|되다|시키다|이다/g,"").trim();
  if (core.length >= 2 && a.indexOf(core) >= 0) return true;
  return false;
}

function submitTestAns() {
  var inp = document.getElementById("tinput");
  if (!inp) return;
  var val = inp.value.trim();
  var curr = tList[tIdx];

  if (isSim(val, curr.meaning)) {
    tScore++;
    tCorrectNames.push(curr.word);
  } else {
    tWrong.push({ word: curr.word, input: val || "(미입력)", correct: curr.meaning });
  }

  tIdx++;
  showTestQuestion();
}

function renderTestResult() {
  var pct = Math.round((tScore / tList.length) * 100);
  var emoji = pct === 100 ? "🏆" : pct >= 80 ? "🎉" : pct >= 60 ? "👍" : "💪";

  var html = '';
  html += '<div class="res-card">';
  html += '  <div class="res-emoji">' + emoji + '</div>';
  html += '  <div class="res-score">' + tScore + ' / ' + tList.length + ' (' + pct + '점)</div>';
  html += '  <div class="res-sub">학생: ' + esc(tName) + '</div>';

  if (tWrong.length > 0) {
    html += '<div class="wrong-list">';
    tWrong.forEach(function(w) {
      html += '<div class="wrong-item">';
      html += '  <span class="w-item-w">' + esc(w.word) + '</span>';
      html += '  <span class="w-item-i">' + esc(w.input) + '</span>';
      html += '  <span class="w-item-c">' + esc(w.correct) + '</span>';
      html += '</div>';
    });
    html += '</div>';
  }

  html += '  <button class="btn-primary" style="background:#25D366; margin-bottom:8px;" onclick="copyResult()">📋 카톡으로 결과 복사</button>';
  html += '  <button class="btn-primary" onclick="renderSetup()">↩ 다시 테스트</button>';
  html += '</div>';

  document.getElementById("tarea").innerHTML = html;
}

function copyResult() {
  var pct = Math.round((tScore / tList.length) * 100);
  var d = new Date();
  var dateStr = d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate());

  var txt = "[씨유에탑 문현고2 중간고사] 테스트 결과\n";
  txt += "날짜: " + dateStr + "\n";
  txt += "이름: " + tName + "\n";
  txt += "점수: " + tScore + "/" + tList.length + " (" + pct + "점)\n";
  txt += "─────────────────\n";
  txt += "❌ 틀린 단어 (" + tWrong.length + "개)\n";
  tWrong.forEach(function(w) {
    txt += "  " + w.word + " → 입력:" + w.input + " / 정답:" + w.correct + "\n";
  });
  txt += "─────────────────\n";
  txt += "✅ 맞은 단어: " + tCorrectNames.join(", ");

  navigator.clipboard.writeText(txt).then(function() {
    alert("결과가 클립보드에 복사되었습니다.");
  }, function() {
    alert("복사에 실패했습니다.");
  });
}

function pad(n) { return n < 10 ? "0" + n : n; }

function shuffle(arr) {
  for (var i = arr.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var temp = arr[i];
    arr[i] = arr[j];
    arr[j] = temp;
  }
}

// Init
renderRangeBar("lrbar", lri, "setLR");
renderList();
</script>
</body>
</html>

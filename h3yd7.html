      --warn: #F59E0B;
      --gray: #6B7280;
      --border: #E5E7EB;
      --bg: #F9FAFB;
    }

    body { background-color: #1e293b; display: flex; justify-content: center; min-height: 100vh; }
    .en { font-family: 'Nunito', sans-serif; }
    
    #app {
      width: 100%;
      max-width: 420px;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 0 20px rgba(0,0,0,0.15);
    }
    
    .header {
      background: #ffffff;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      text-align: center;
    }
    .header-brand {
      font-size: 18px;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: -0.5px;
    }
    .header-sub {
      font-size: 13px;
      color: var(--gray);
      margin-top: 4px;
    }
    
    .nav-tabs {
      display: flex;
      background: #ffffff;
      border-bottom: 1px solid var(--border);
    }
    .tab-btn {
      flex: 1;
      padding: 12px 0;
      border: none;
      background: none;
      font-size: 14px;
      font-weight: 700;
      color: var(--gray);
      cursor: pointer;
      border-bottom: 2px solid transparent;
    }
    .tab-btn.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }
    
    .tab-content {
      display: none;
      flex: 1;
      padding: 16px;
      flex-direction: column;
    }
    .tab-content.active {
      display: flex;
    }
    
    .range-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 12px;
      scrollbar-width: none;
    }
    .range-bar::-webkit-scrollbar { display: none; }
    .r-btn {
      white-space: nowrap;
      padding: 6px 12px;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: #ffffff;
      font-size: 12px;
      font-weight: 600;
      color: var(--gray);
      cursor: pointer;
    }
    .r-btn.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }
    
    .search-box {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 12px;
      outline: none;
      background: #fff;
    }
    .search-box:focus { border-color: var(--primary); }
    
    .filter-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .f-btn {
      flex: 1;
      padding: 8px;
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--gray);
      cursor: pointer;
    }
    .f-btn.active {
      background: var(--primary-light);
      color: var(--primary);
      border-color: var(--primary);
    }
    
    .word-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .word-card {
      background: #ffffff;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .word-card.known { opacity: 0.35; }
    .chk-btn {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: #fff;
    }
    .word-card.known .chk-btn {
      background: var(--success);
      border-color: var(--success);
    }
    .card-body { flex: 1; }
    .card-word {
      font-size: 16px;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 2px;
    }
    .card-meaning {
      font-size: 14px;
      color: var(--gray);
    }
    .ibtn {
      border: none;
      background: none;
      font-size: 18px;
      cursor: pointer;
      padding: 4px;
    }

    .fc-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 16px;
    }
    .fc-card {
      width: 100%;
      height: 240px;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      cursor: pointer;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      padding: 20px;
      text-align: center;
    }
    .fc-fav {
      position: absolute;
      top: 12px;
      right: 12px;
    }
    .fc-word {
      font-size: 24px;
      font-weight: 800;
      color: #1e293b;
      margin-bottom: 12px;
    }
    .fc-meaning {
      font-size: 16px;
      color: var(--primary);
      font-weight: 700;
      min-height: 24px;
    }
    .fc-nav {
      display: flex;
      width: 100%;
      gap: 8px;
    }
    .fc-nav-btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: var(--primary);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    .fc-nav-btn.sec {
      background: #e2e8f0;
      color: #475569;
    }

    .quiz-container {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .q-card {
      background: #fff;
      padding: 24px;
      border-radius: 12px;
      border: 1px solid var(--border);
      text-align: center;
      margin-bottom: 20px;
    }
    .q-word {
      font-size: 24px;
      font-weight: 800;
      color: #1e293b;
    }
    .q-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .q-opt {
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      font-size: 15px;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
    }
    .q-opt.cor {
      background: var(--success);
      color: #fff;
      border-color: var(--success);
    }
    .q-opt.wrg {
      background: var(--danger);
      color: #fff;
      border-color: var(--danger);
    }
    .q-res {
      text-align: center;
      padding: 40px 20px;
    }
    .res-emoji { font-size: 48px; margin-bottom: 12px; }
    .res-score { font-size: 24px; font-weight: 800; margin-bottom: 20px; }
    
    .btn-action {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: var(--primary);
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .test-container {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-label {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 6px;
      display: block;
    }
    .t-input {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }
    .t-input:focus { border-color: var(--primary); }
    
    .p-bar-bg {
      width: 100%;
      height: 8px;
      background: var(--border);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 12px;
    }
    .p-bar-fill {
      height: 100%;
      background: var(--primary);
      width: 0%;
      transition: width 0.2s;
    }
    .t-status {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: var(--gray);
      margin-bottom: 16px;
      font-weight: 600;
    }
    
    .wrg-list {
      margin: 16px 0;
      text-align: left;
      max-height: 200px;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px;
      background: #fff;
    }
    .wrg-item {
      font-size: 13px;
      padding: 6px;
      border-bottom: 1px dashed var(--border);
    }
    .wrg-item:last-child { border-bottom: none; }
    .btn-copy {
      background: #25D366;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 15px;
      font-weight: 700;
      width: 100%;
      cursor: pointer;
      margin-bottom: 8px;
    }

</head>

  <div id="app">

      <div class="header-brand en">씨유에탑 ✦ 영어단어장</div>
      <div class="header-sub">수특 영독7강 어휘 · 총 403단어</div>
    </div>
    
    <div class="nav-tabs">
      <button class="tab-btn active" id="tb-list" onclick="switchTab('list')">단어목록</button>
      <button class="tab-btn" id="tb-flash" onclick="switchTab('flash')">플래시카드</button>
      <button class="tab-btn" id="tb-test" onclick="switchTab('test')">📝 테스트</button>
    </div>

    <!-- 탭 1: 단어목록 -->
    <div class="tab-content active" id="tab-list">
      <div class="range-bar" id="lrbar"></div>
      <input type="text" class="search-box" id="lsearch" placeholder="영어 또는 한글 검색..." oninput="renderList()">
      <div class="filter-bar">
        <button class="f-btn active" id="lf-all" onclick="setLFilter('all')">전체</button>

        <button class="f-btn" id="lf-fav" onclick="setLFilter('fav')">⭐즐겨찾기</button>
      </div>
      <div class="word-list" id="lcontainer"></div>
    </div>

    <!-- 탭 2: 플래시카드 -->
    <div class="tab-content" id="tab-flash">
      <div class="range-bar" id="fcrbar"></div>
      <div class="fc-container">
        <div class="fc-card" id="fccard">
          <button class="ibtn fc-fav" id="fcfav" onclick="toggleFcFav(event)">☆</button>
          <div class="fc-word en" id="fcword">-</div>
          <div class="fc-meaning" id="fcmeaning">탭하여 뜻 확인</div>
        </div>
        <div class="fc-nav">
          <button class="fc-nav-btn sec" onclick="fcPrev()">◀ 이전</button>
          <button class="fc-nav-btn" style="background:var(--warn);" onclick="speakFc()">🔊</button>
          <button class="fc-nav-btn" onclick="fcNext()">다음 ▶</button>
        </div>
      </div>
    </div>

    <!-- 탭 3: 테스트 (4지선다 객관식) -->
    <div class="tab-content" id="tab-test">
      <div class="test-container" id="tcontainer"></div>
    </div>
  </div>

      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(t);
      u.lang = "en-US";
      u.rate = 0.85;
      window.speechSynthesis.speak(u);
    }
    function speakFc() {
      speak(document.getElementById("fcword").textContent);
    }

    function buildRanges(ws) {
      var r = [{ label: "전체", s: 0, e: ws.length }];
      for (var i = 0; i < ws.length; i += 50) {
        r.push({ label: (i+1) + "-" + Math.min(i+50, ws.length), s: i, e: Math.min(i+50, ws.length) });
      }
      return r;
    }
    var ranges = buildRanges(rawWords);

    var lri = 0, fri = 0, tri = 0;
    var lFilter = "all";

    function renderRangeBar(elId, curIdx, fnName) {
      var el = document.getElementById(elId);
      var html = "";
      ranges.forEach(function(r, idx) {
        var cls = idx === curIdx ? "r-btn active" : "r-btn";
        html += '<button class="' + cls + '" onclick="' + fnName + '(' + idx + ')">' + r.label + '</button>';
      });
      el.innerHTML = html;
    }

    function setLR(i) { lri = i; renderRangeBar("lrbar", lri, "setLR"); renderList(); }
    function setFR(i) { fri = i; renderRangeBar("fcrbar", fri, "setFR"); initFC(); }
    function setTR(i) { tri = i; renderRangeBar("trbar", tri, "setTR"); }

    function setLFilter(f) {
      lFilter = f;
      ["all","unk","fav"].forEach(function(k){
        document.getElementById("lf-"+k).classList.toggle("active", k===f);
      });
      renderList();
    }

    function renderList() {
      var r = ranges[lri];
      var sub = rawWords.slice(r.s, r.e);
      var q = document.getElementById("lsearch").value.trim().toLowerCase();
      var container = document.getElementById("lcontainer");
      var html = "";

      sub.forEach(function(w) {
        var state = getItemState(w);
        if (lFilter === "unk" && state.status === "known") return;
        if (lFilter === "fav" && !state.fav) return;

        if (q) {
          var matchW = w.word.toLowerCase().indexOf(q) >= 0;
          var matchM = w.meaning.toLowerCase().indexOf(q) >= 0;
          if (!matchW && !matchM) return;
        }

        var isKnown = state.status === "known";
        var cardCls = isKnown ? "word-card known" : "word-card";
        var chkTxt = isKnown ? "✓" : "";
        var favTxt = state.fav ? "★" : "☆";

        html += '<div class="' + cardCls + '">';
        html += '  <button class="chk-btn" data-w="' + esc(w.word) + '" data-m="' + esc(w.meaning) + '" onclick="toggleKnown(this)">' + chkTxt + '</button>';
        html += '  <div class="card-body">';
        html += '    <div class="card-word en">' + esc(w.word) + '</div>';
        html += '    <div class="card-meaning">' + esc(w.meaning) + '</div>';
        html += '  </div>';
        html += '  <button class="ibtn" data-w="' + esc(w.word) + '" onclick="speak(this.dataset.w)">🔊</button>';
        html += '  <button class="ibtn" data-w="' + esc(w.word) + '" data-m="' + esc(w.meaning) + '" onclick="toggleFav(this)">' + favTxt + '</button>';
        html += '</div>';
      });

      container.innerHTML = html;
    }

    function toggleKnown(el) {
      var w = { word: el.dataset.w, meaning: el.dataset.m };
      var st = getItemState(w);
      var next = st.status === "known" ? "none" : "known";
      updateItemState(w, "status", next);
      renderList();
    }

    function toggleFav(el) {
      var w = { word: el.dataset.w, meaning: el.dataset.m };
      var st = getItemState(w);
      updateItemState(w, "fav", !st.fav);
      renderList();
    }

    var fcList = [];
    var fcIdx = 0;
    var fcFlipped = false;
    var fcTX = 0;

    function initFC() {
      var r = ranges[fri];
      fcList = rawWords.slice(r.s, r.e);
      fcIdx = 0;
      showFC();
    }

    function showFC() {
      if (!fcList.length) return;
      fcFlipped = false;
      var w = fcList[fcIdx];
      var st = getItemState(w);
      document.getElementById("fcword").textContent = w.word;
      document.getElementById("fcmeaning").textContent = "탭하여 뜻 확인";
      document.getElementById("fcmeaning").style.color = "var(--gray)";
      document.getElementById("fcfav").textContent = st.fav ? "★" : "☆";
    }

    function fcFlip() {
      if (!fcList.length || fcFlipped) return;
      fcFlipped = true;
      var w = fcList[fcIdx];
      document.getElementById("fcmeaning").textContent = w.meaning;
      document.getElementById("fcmeaning").style.color = "var(--primary)";
      speak(w.word);
    }

    function fcNext() {
      if (!fcList.length) return;
      fcIdx = (fcIdx + 1) % fcList.length;
      showFC();
    }

    function fcPrev() {
      if (!fcList.length) return;
      fcIdx = (fcIdx - 1 + fcList.length) % fcList.length;
      showFC();
    }

    function toggleFcFav(e) {
      e.stopPropagation();
      if (!fcList.length) return;
      var w = fcList[fcIdx];
      var st = getItemState(w);
      updateItemState(w, "fav", !st.fav);
      document.getElementById("fcfav").textContent = !st.fav ? "★" : "☆";
    }

    (function(){
      var card = document.getElementById("fccard");
      card.addEventListener("click", function(e) {
        if (e.target.id === "fcfav") return;
        fcFlip();
      });
      card.addEventListener("touchstart", function(e) {
        fcTX = e.touches[0].clientX;
      }, {passive:true});
      card.addEventListener("touchend", function(e) {
        var dx = e.changedTouches[0].clientX - fcTX;
        if (Math.abs(dx) > 50) { if (dx < 0) fcNext(); else fcPrev(); }
      }, {passive:true});
    })();

    function shuffle(arr) {
      var a = arr.slice();
      for (var i = a.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var temp = a[i];
        a[i] = a[j];
        a[j] = temp;
      }
      return a;
    }

    var tState = "setup";
    var tQuestions = [];
    var tIdx = 0;
    var tScore = 0;
    var tName = "";
    var tWrongList = [];
    var tRightList = [];
    var tLocked = false;

    function renderSetup() {
      tState = "setup";
      var container = document.getElementById("tcontainer");
      var html = '';
      html += '<div class="form-group">';
      html += '  <label class="form-label">이름 입력</label>';
      html += '  <input type="text" class="t-input" id="tname-in" placeholder="이름을 입력하세요" value="' + esc(tName) + '">';
      html += '</div>';
      html += '<div class="form-group">';
      html += '  <label class="form-label">범위 선택</label>';
      html += '  <div class="range-bar" id="trbar"></div>';
      html += '</div>';
      html += '<button class="btn-action" onclick="startTest()">테스트 시작 ▶</button>';

      container.innerHTML = html;
      renderRangeBar("trbar", tri, "setTR");
    }

    function startTest() {
      var nameIn = document.getElementById("tname-in").value.trim();
      if (!nameIn) {
        alert("이름을 입력해 주세요.");
        return;
      }
      tName = nameIn;
      var r = ranges[tri];
      var pool = rawWords.slice(r.s, r.e);
      pool = shuffle(pool);
      var count = Math.min(50, pool.length);
      tQuestions = pool.slice(0, count);

      tIdx = 0;
      tScore = 0;
      tWrongList = [];
      tRightList = [];
      tState = "run";
      showTestQ();
    }

    function showTestQ() {
      var container = document.getElementById("tcontainer");
      if (tIdx >= tQuestions.length) {
        showTestResult();
        return;
      }

      var cur = tQuestions[tIdx];
      speak(cur.word);
      tLocked = false;

      var optionPool = rawWords.filter(function(x){ return x.meaning !== cur.meaning; });
      optionPool = shuffle(optionPool);
      var opts = optionPool.slice(0, 3);
      opts.push(cur);
      opts = shuffle(opts);

      var pct = Math.round((tIdx / tQuestions.length) * 100);
      var html = '';
      html += '<div class="p-bar-bg"><div class="p-bar-fill" style="width:' + pct + '%"></div></div>';
      html += '<div class="t-status"><span>문제 ' + (tIdx + 1) + ' / ' + tQuestions.length + '</span><span>✅ 맞춤: ' + tScore + '</span></div>';
      html += '<div class="q-card"><div class="q-word en">' + esc(cur.word) + '</div></div>';
      html += '<div class="q-options">';
      opts.forEach(function(o) {
        var isCor = (o.word === cur.word) ? "1" : "0";
        html += '<button class="q-opt" data-cor="' + isCor + '" onclick="submitTestAns(this)">' + esc(o.meaning) + '</button>';
      });
      html += '</div>';

      container.innerHTML = html;
    }

    function submitTestAns(el) {
      if (tLocked) return;
      tLocked = true;

      var cur = tQuestions[tIdx];
      var isCor = el.getAttribute("data-cor") === "1";
      var chosenText = el.textContent;

      if (isCor) {
        el.classList.add("cor");
        tScore++;
        tRightList.push(cur.word);
        speak(cur.word);
      } else {
        el.classList.add("wrg");
        var opts = document.querySelectorAll(".q-opt");
        for (var i = 0; i < opts.length; i++) {
          if (opts[i].getAttribute("data-cor") === "1") {
            opts[i].classList.add("cor");
          }
        }
        tWrongList.push({ word: cur.word, input: chosenText, correct: cur.meaning });
      }

      setTimeout(function() {
        tIdx++;
        showTestQ();
      }, 1000);
    }

    function showTestResult() {
      var container = document.getElementById("tcontainer");
      var pct = Math.round((tScore / tQuestions.length) * 100);
      var emo = "💪";
      if (pct === 100) emo = "🏆";
      else if (pct >= 80) emo = "🎉";
      else if (pct >= 60) emo = "👍";

      var html = '<div class="q-res" style="padding: 20px 0;">';
      html += '<div class="res-emoji">' + emo + '</div>';
      html += '<div class="res-score">' + tScore + ' / ' + tQuestions.length + ' (' + pct + '점)</div>';

      if (tWrongList.length > 0) {
        html += '<div class="wrg-list">';
        tWrongList.forEach(function(item) {
          html += '<div class="wrg-item">❌ <b>' + esc(item.word) + '</b><br>입력: ' + esc(item.input) + ' / 정답: ' + esc(item.correct) + '</div>';
        });
        html += '</div>';
      }

      html += '<button class="btn-copy" onclick="copyResult()">📋 카톡으로 결과 복사</button>';
      html += '<button class="btn-action" onclick="renderSetup()">↩ 다시 테스트</button>';
      html += '</div>';

      container.innerHTML = html;
    }

    function copyResult() {
      var pct = Math.round((tScore / tQuestions.length) * 100);
      var d = new Date();
      var dateStr = d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
      
      var txt = "[씨유에탑 수특 영독7강 어휘] 테스트 결과\n";
      txt += "날짜: " + dateStr + "\n";
      txt += "이름: " + tName + "\n";
      txt += "점수: " + tScore + "/" + tQuestions.length + " (" + pct + "점)\n";
      txt += "─────────────────\n";
      
      if (tWrongList.length > 0) {
        txt += "❌ 틀린 단어 (" + tWrongList.length + "개)\n";
        tWrongList.forEach(function(item) {
          txt += "  " + item.word + " → 입력:" + item.input + " / 정답:" + item.correct + "\n";
        });
      } else {
        txt += "❌ 틀린 단어 없음! 완벽합니다!\n";
      }
      
      txt += "─────────────────\n";
      txt += "✅ 맞은 단어: " + tRightList.join(", ");

      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(txt).then(function() {
          alert("결과가 클립보드에 복사되었습니다.");
        });
      } else {
        var ta = document.createElement("textarea");
        ta.value = txt;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        alert("결과가 클립보드에 복사되었습니다.");
      }
    }

    function switchTab(t) {
      ["list","flash","test"].forEach(function(n) {
        document.getElementById("tb-"+n).classList.toggle("active", n===t);
        document.getElementById("tab-"+n).classList.toggle("active", n===t);
      });
      if (t==="list")  { renderRangeBar("lrbar", lri, "setLR"); renderList(); }
      if (t==="flash") { renderRangeBar("fcrbar", fri, "setFR"); initFC(); }
      if (t==="test")  { renderSetup(); }
    }

    renderRangeBar("lrbar", lri, "setLR");
    renderList();
  </script>
</body>
</html>

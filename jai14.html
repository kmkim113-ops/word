.hdr p { font-size: 13px; opacity: 0.88; margin-top: 3px; font-weight: 500; }

.tabs { display: flex; background: #fff; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
.tab { flex: 1; padding: 12px 0; border: none; background: none; font-family: 'Noto Sans KR', sans-serif; font-size: 14px; font-weight: 700; color: var(--gray); border-bottom: 3px solid transparent; cursor: pointer; }
.tab.on { color: var(--primary); border-bottom-color: var(--primary); }
.pane { display: none; padding: 14px 14px 30px; flex: 1; }
.pane.on { display: block; }

.rbtn { flex-shrink: 0; padding: 6px 12px; border-radius: 20px; border: 1.5px solid var(--border); background: #fff; font-size: 12px; font-weight: 600; color: var(--gray); cursor: pointer; white-space: nowrap; font-family: 'Nunito', sans-serif; }

.fbtn { flex: 1; padding: 8px 0; border: 1.5px solid var(--border); background: #fff; border-radius: 10px; font-size: 13px; font-weight: 700; color: var(--gray); cursor: pointer; font-family: 'Noto Sans KR', sans-serif; }
.fbtn.on { background: var(--primary-light); border-color: var(--primary); color: var(--primary); }
.stat { font-size: 12px; color: var(--gray); margin-bottom: 8px; }

.wcard { display: flex; align-items: center; gap: 10px; background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 11px 10px; margin-bottom: 7px; transition: opacity .2s; }
.wcard.known { opacity: 0.35; }
.chk { width: 26px; height: 26px; flex-shrink: 0; border-radius: 8px; border: 2px solid var(--border); background: #fff; color: #fff; font-size: 14px; font-weight: 900; cursor: pointer; }
.chk.on { background: var(--success); border-color: var(--success); }

.wmean { font-size: 13px; color: #4B5563; margin-top: 2px; word-break: keep-all; }
.wacts { display: flex; gap: 2px; flex-shrink: 0; }

  </div>

    <div id="tarea"></div>
  </div>
</div>

var SERIES = '고1 자이 4회';
var SKEY = 'cutop_go1_xai_4';

function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

function speak(t) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance(t);
  u.lang = 'en-US';
  u.rate = 0.85;
  window.speechSynthesis.speak(u);
}
function speakFc() { speak(document.getElementById('fcword').textContent); }

/* ---------- storage ---------- */
var ST = {};
try { ST = JSON.parse(localStorage.getItem(SKEY) || '{}') || {}; } catch (e) { ST = {}; }
function saveST() { try { localStorage.setItem(SKEY, JSON.stringify(ST)); } catch (e) {} }
function storeKey(w) { return w.word + '|' + w.meaning; }
function getS(w) {
  var s = ST[storeKey(w)];
  return s ? s : { status: '', fav: false };
}
function setS(w, s) { ST[storeKey(w)] = s; saveST(); }

function shuffle(a) {
  var b = a.slice();
  for (var i = b.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = b[i]; b[i] = b[j]; b[j] = t;
  }
  return b;
}

/* ---------- ranges ---------- */
function buildRanges(ws) {
  var r = [{label:'전체', s:0, e:ws.length}];
  for (var i = 0; i < ws.length; i += 50) {
    var e = Math.min(i + 50, ws.length);
    r.push({label:(i+1)+'~'+e, s:i, e:e});
  }
  return r;
}
var RANGES = buildRanges(rawWords);

function renderRangeBar(barId, ri, fn) {
  var bar = document.getElementById(barId);
  if (!bar) return;
  var h = [];
  for (var i = 0; i < RANGES.length; i++) {
    var cls = 'rbtn' + (i === ri ? ' on' : '');
    h.push('<button class="' + cls + '" data-i="' + i + '" onclick="' + fn + '(this)">' + RANGES[i].label + '</button>');
  }
  bar.innerHTML = h.join('');
}
function wordsForRange(ri) {
  var r = RANGES[ri];
  return rawWords.slice(r.s, r.e);
}

var wri = 0, fri = 0, tri = 0;
function setWR(el) { wri = parseInt(el.getAttribute('data-i'), 10); renderList(); }
function setFCR(el) { fri = parseInt(el.getAttribute('data-i'), 10); fcIdx = 0; fcInit(); }
function setTR(el) { tri = parseInt(el.getAttribute('data-i'), 10); renderRangeBar('trbar', tri, 'setTR'); }

/* ---------- tab 1: list ---------- */
var wfilter = 'all';
function setFilter(f) {
  wfilter = f;
  document.getElementById('f-all').classList.toggle('on', f === 'all');
  document.getElementById('f-unk').classList.toggle('on', f === 'unk');
  document.getElementById('f-fav').classList.toggle('on', f === 'fav');
  renderList();
}
function renderList() {
  renderRangeBar('wrbar', wri, 'setWR');
  var pool = wordsForRange(wri);
  var q = document.getElementById('wsearch').value.replace(/^\s+|\s+$/g, '').toLowerCase();
  var list = [];
  var knownCnt = 0;
  for (var j = 0; j < pool.length; j++) {
    var pw = pool[j], ps = getS(pw);
    if (ps.status === 'known') knownCnt++;
    if (wfilter === 'unk' && ps.status === 'known') continue;
    if (wfilter === 'fav' && !ps.fav) continue;
    if (q && pw.word.toLowerCase().indexOf(q) < 0 && pw.meaning.toLowerCase().indexOf(q) < 0) continue;
    list.push(pw);
  }
  var h = [];
  for (var i = 0; i < list.length; i++) {
    var w = list[i], s = getS(w);
    var known = s.status === 'known', fav = s.fav;
    h.push('<div class="wcard' + (known ? ' known' : '') + '">');
    h.push('<button class="chk' + (known ? ' on' : '') + '" data-wi="' + i + '" onclick="toggleKnown(this)">' + (known ? '✔' : '') + '</button>');
    h.push('<div class="wbody">');
    h.push('<div class="wword">' + esc(w.word) + '</div>');
    h.push('<div class="wmean">' + esc(w.meaning) + '</div>');
    h.push('</div>');
    h.push('<div class="wacts">');
    h.push('<button class="ibtn" data-w="' + esc(w.word) + '" onclick="speak(this.dataset.w)">🔊</button>');
    h.push('<button class="ibtn favbtn' + (fav ? ' on' : '') + '" data-wi="' + i + '" onclick="toggleFav(this)">' + (fav ? '★' : '☆') + '</button>');
    h.push('</div>');
    h.push('</div>');
  }
  if (!list.length) h.push('<div class="empty">조건에 맞는 단어가 없어요</div>');
  document.getElementById('wlist').innerHTML = h.join('');
  var st = [];
  st.push('표시 <b>' + list.length + '</b>개 · 외운 단어 <b>' + knownCnt + '</b>/' + pool.length);
  document.getElementById('wstat').innerHTML = st.join('');
  window._wlist = list;
}
function toggleKnown(el) {
  var w = window._wlist[parseInt(el.getAttribute('data-wi'), 10)];
  if (!w) return;
  var s = getS(w);
  setS(w, { status: s.status === 'known' ? '' : 'known', fav: !!s.fav });
  renderList();
}
function toggleFav(el) {
  var w = window._wlist[parseInt(el.getAttribute('data-wi'), 10)];
  if (!w) return;
  var s = getS(w);
  setS(w, { status: s.status || '', fav: !s.fav });
  renderList();
}

var fcPool = [], fcIdx = 0, fcFlipped = false, fcTX = 0;
var fcEvReg = false;
function fcRegisterEvents() {
  if (fcEvReg) return;
  fcEvReg = true;
  var card = document.getElementById('fccard');
  card.addEventListener('click', function(e) {
    if (e.target.id === 'fcfavbtn') return;
    fcFlip();
  });
  card.addEventListener('touchstart', function(e) {
    fcTX = e.touches[0].clientX;
  }, {passive:true});
  card.addEventListener('touchend', function(e) {
    var dx = e.changedTouches[0].clientX - fcTX;
    if (Math.abs(dx) > 50) { if (dx < 0) fcNext(); else fcPrev(); }
  }, {passive:true});
}
function fcInit() {
  renderRangeBar('fcrbar', fri, 'setFCR');
  fcPool = wordsForRange(fri);
  if (fcIdx >= fcPool.length) fcIdx = 0;
  fcRegisterEvents();
  fcShow();
}
function fcShow() {
  if (!fcPool.length) return;
  fcFlipped = false;
  var w = fcPool[fcIdx];
  document.getElementById('fcword').textContent = w.word;
  document.getElementById('fcmean').textContent = w.meaning;
  document.getElementById('fcmean').style.display = 'none';
  document.getElementById('fctap').style.display = 'block';
  document.getElementById('fcctr').textContent = (fcIdx+1) + '/' + fcPool.length;
  var fav = getS(w).fav;
  var fb = document.getElementById('fcfavbtn');
  fb.textContent = fav ? '★' : '☆';
  fb.className = fav ? 'on' : '';
}
function fcFlip() {
  if (fcFlipped) return;
  if (!fcPool.length) return;
  fcFlipped = true;
  document.getElementById('fcmean').style.display = 'block';
  document.getElementById('fctap').style.display = 'none';
  speak(fcPool[fcIdx].word);
}
function fcNext() { if (!fcPool.length) return; fcIdx = (fcIdx + 1) % fcPool.length; fcShow(); }
function fcPrev() { if (!fcPool.length) return; fcIdx = (fcIdx - 1 + fcPool.length) % fcPool.length; fcShow(); }
function fcToggleFav() {
  if (!fcPool.length) return;
  var w = fcPool[fcIdx], s = getS(w);
  setS(w, { status: s.status || '', fav: !s.fav });
  fcShow();
  if (fcFlipped) { document.getElementById('fcmean').style.display = 'block'; document.getElementById('fctap').style.display = 'none'; }
}

function tStart() {
  var nm = document.getElementById('tname').value.replace(/^\s+|\s+$/g, '');
  if (!nm) { alert('이름을 입력해 주세요.'); return; }
  tName = nm;

  tQs = pool.slice(0, Math.min(T_COUNT, pool.length));
  if (!tQs.length) { alert('출제할 단어가 없습니다.'); return; }
  tIdx = 0; tCorrect = 0; tResults = [];
  var d = new Date();
  tDate = d.getFullYear() + '. ' + (d.getMonth() + 1) + '. ' + d.getDate() + '.';
  tRender();
}

function tBuildOpts(w) {
  var seen = {};
  seen[w.meaning] = true;
  var cands = shuffle(rawWords);
  var wrong = [];
  for (var i = 0; i < cands.length && wrong.length < 3; i++) {
    var m = cands[i].meaning;
    if (seen[m]) continue;
    seen[m] = true;
    wrong.push(m);
  }
  wrong.push(w.meaning);
  return shuffle(wrong);
}

function tRender() {
  tLocked = false;
  var w = tQs[tIdx];
  tOpts = tBuildOpts(w);
  var pct = Math.round(tIdx / tQs.length * 100);
  var h = [];
  h.push('<div class="pbar"><div class="pfill" style="width:' + pct + '%"></div></div>');
  h.push('<div class="tmeta"><span>' + (tIdx + 1) + ' / ' + tQs.length + '</span><span class="ok">맞춤 ' + tCorrect + '</span></div>');
  h.push('<div class="tq">');
  h.push('<div class="tqword">' + esc(w.word) + '</div>');
  h.push('<div class="tqpron"></div>');
  h.push('<button class="tqspk" data-w="' + esc(w.word) + '" onclick="speak(this.dataset.w)">🔊 다시 듣기</button>');
  h.push('</div>');
  h.push('<div id="toptions">');
  for (var i = 0; i < tOpts.length; i++) {
    h.push('<button class="topt" data-k="' + i + '" onclick="tPick(this)">' + esc(tOpts[i]) + '</button>');
  }
  h.push('</div>');
  h.push('<button class="bigbtn" id="t-next-btn" onclick="tNext()">' + (tIdx === tQs.length - 1 ? '결과 보기 →' : '다음 →') + '</button>');
  document.getElementById('tarea').innerHTML = h.join('');
  speak(w.word);
}

function tPick(el) {
  var k = parseInt(el.getAttribute('data-k'), 10);
  tAnswer(el, tOpts[k], tQs[tIdx].meaning);
}

function tAnswer(el, chosen, correct) {
  if (tLocked) return;
  tLocked = true;
  var opts = document.querySelectorAll('#toptions .topt');
  for (var i = 0; i < opts.length; i++) {
    var b = opts[i];
    var bk = parseInt(b.getAttribute('data-k'), 10);
    if (tOpts[bk] === correct) b.className += ' correct';
    else if (b === el) b.className += ' wrong';
    b.style.pointerEvents = 'none';
  }
  var ok = (chosen === correct);
  if (ok) tCorrect++;
  tResults.push({ word: tQs[tIdx].word, meaning: correct, ans: chosen, ok: ok });
  var okEl = document.querySelector('.tmeta .ok');
  if (okEl) okEl.textContent = '맞춤 ' + tCorrect;
  document.getElementById('t-next-btn').style.display = 'block';
}

function tNext() {
  if (!tLocked) return;
  tIdx++;
  if (tIdx >= tQs.length) tShowResult();
  else tRender();
}

function tShowResult() {
  var total = tQs.length;
  var pct = Math.round(tCorrect / total * 100);
  var emo = pct === 100 ? '🏆' : (pct >= 80 ? '🎉' : (pct >= 60 ? '👍' : '💪'));
  var wrongs = [], rights = [];
  for (var i = 0; i < tResults.length; i++) {
    if (tResults[i].ok) rights.push(tResults[i]); else wrongs.push(tResults[i]);
  }
  var h = [];
  h.push('<div class="tbox">');
  h.push('<div class="rscore"><div class="remoji">' + emo + '</div>');
  h.push('<div class="rnum">' + tCorrect + '/' + total + '</div>');
  h.push('<div class="rpct">' + pct + '점 · ' + esc(tName) + '</div></div>');
  if (wrongs.length) {
    h.push('<div class="rsec">❌ 틀린 단어 (' + wrongs.length + '개)</div>');
    for (var j = 0; j < wrongs.length; j++) {
      var r = wrongs[j];
      h.push('<div class="ritem"><b>' + esc(r.word) + '</b><br>');
      h.push('<span class="ra">입력: ' + esc(r.ans) + '</span> / <span class="rc">정답: ' + esc(r.meaning) + '</span></div>');
    }
  }
  if (rights.length) {
    var names = [];
    for (var k = 0; k < rights.length; k++) names.push(esc(rights[k].word));
    h.push('<div class="rsec">✅ 맞은 단어 (' + rights.length + '개)</div>');
    h.push('<div class="rok">' + names.join(', ') + '</div>');
  }
  h.push('<button class="bigbtn copybtn" onclick="tCopy()">📋 카톡으로 결과 복사</button>');
  h.push('<button class="bigbtn retrybtn" onclick="tSetup()">↩ 다시 테스트</button>');
  h.push('</div>');
  document.getElementById('tarea').innerHTML = h.join('');
}

function tCopyText() {
  var total = tQs.length;
  var pct = Math.round(tCorrect / total * 100);
  var L = [];
  L.push('[씨유에탑 ' + SERIES + '] 테스트 결과');
  L.push('날짜: ' + tDate);
  L.push('이름: ' + tName);
  L.push('점수: ' + tCorrect + '/' + total + ' (' + pct + '점)');
  L.push('─────────────────');
  var wrongs = [], rights = [];
  for (var i = 0; i < tResults.length; i++) {
    if (tResults[i].ok) rights.push(tResults[i].word); else wrongs.push(tResults[i]);
  }
  L.push('❌ 틀린 단어 (' + wrongs.length + '개)');
  for (var j = 0; j < wrongs.length; j++) {
    L.push('  ' + wrongs[j].word + ' → 입력:' + wrongs[j].ans + ' / 정답:' + wrongs[j].meaning);
  }
  L.push('─────────────────');
  L.push('✅ 맞은 단어: ' + rights.join(', '));
  return L.join('\n');
}

function tCopy() {
  var txt = tCopyText();
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(function() {
      alert('결과가 복사되었습니다. 카톡에 붙여넣기 하세요!');
    }, function() { tCopyFallback(txt); });
  } else {
    tCopyFallback(txt);
  }
}
function tCopyFallback(txt) {
  var ta = document.createElement('textarea');
  ta.value = txt;
  ta.setAttribute('readonly', '');
  ta.style.position = 'fixed';
  ta.style.top = '-1000px';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); alert('결과가 복사되었습니다. 카톡에 붙여넣기 하세요!'); }
  catch (e) { alert('복사에 실패했습니다. 직접 선택해서 복사해 주세요.'); }
  document.body.removeChild(ta);
}

/* ---------- tabs ---------- */
var TABS = ['w','fc','t'];
function showTab(id) {
  for (var i = 0; i < TABS.length; i++) {
    var t = TABS[i];
    document.getElementById('pane-' + t).classList.toggle('on', t === id);
    document.getElementById('tb-' + t).classList.toggle('on', t === id);
  }
  if (id === 'w')  { renderRangeBar('wrbar', wri, 'setWR'); renderList(); }
  if (id === 'fc') { fcInit(); }
  if (id === 't')  { tSetup(); }
}

renderList();
</script>

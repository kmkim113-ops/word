<!DOCTYPE html>

:root {

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { background: var(--bg); }
body { font-family: 'Noto Sans KR', sans-serif; color: #111827; }
.app { max-width: 420px; margin: 0 auto; min-height: 100vh; background: var(--bg); display: flex; flex-direction: column; }
.hdr { background: var(--primary); color: #fff; padding: 18px 18px 14px; }
.hdr h1 { font-size: 19px; font-weight: 900; letter-spacing: -0.3px; }
.hdr p { font-size: 13px; opacity: .88; margin-top: 3px; }
.hdr p b { font-family: 'Nunito', sans-serif; }
.tabs { display: flex; background: #fff; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
.tab { flex: 1; padding: 12px 4px; border: none; background: none; font-family: inherit; font-size: 14px; font-weight: 700; color: var(--gray); border-bottom: 3px solid transparent; cursor: pointer; }
.tab.on { color: var(--primary); border-bottom-color: var(--primary); }
.pane { display: none; padding: 14px 14px 30px; flex: 1; }
.pane.on { display: block; }

.rbar { display: flex; gap: 6px; overflow-x: auto; padding: 0 0 8px 0; margin-bottom: 8px; -webkit-overflow-scrolling: touch; scrollbar-width: none; flex-shrink: 0; }
.rbar::-webkit-scrollbar { display: none; }
.rbtn { flex-shrink: 0; padding: 6px 12px; border-radius: 20px; border: 1.5px solid var(--border); background: #fff; font-size: 12px; font-weight: 600; color: var(--gray); cursor: pointer; white-space: nowrap; font-family: 'Nunito', sans-serif; }
.rbtn.on { background: var(--primary); border-color: var(--primary); color: #fff; }

.search { width: 100%; padding: 11px 14px; border: 1.5px solid var(--border); border-radius: 12px; font-size: 14px; font-family: inherit; background: #fff; outline: none; }

.filters { display: flex; gap: 6px; margin: 10px 0; align-items: center; }
.fbtn { padding: 6px 12px; border-radius: 8px; border: 1.5px solid var(--border); background: #fff; font-size: 12px; font-weight: 700; color: var(--gray); cursor: pointer; font-family: inherit; }
.fbtn.on { background: var(--primary-light); border-color: var(--primary); color: var(--primary); }
.cnt { margin-left: auto; font-size: 12px; color: var(--gray); font-family: 'Nunito', sans-serif; font-weight: 700; }
.wcard { display: flex; align-items: center; gap: 10px; background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 8px; transition: opacity .15s; }
.wcard.known { opacity: 0.35; }
.chk { width: 26px; height: 26px; flex-shrink: 0; border-radius: 8px; border: 2px solid var(--border); background: #fff; color: #fff; font-size: 14px; font-weight: 900; cursor: pointer; }
.chk.on { background: var(--success); border-color: var(--success); }
.wbody { flex: 1; min-width: 0; }
.wword { font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 16px; color: #111827; word-break: break-word; }
.wmean { font-size: 13px; color: #4B5563; margin-top: 2px; word-break: keep-all; }
.wacts { display: flex; gap: 2px; flex-shrink: 0; }
.ibtn { width: 34px; height: 34px; border: none; background: none; font-size: 17px; cursor: pointer; border-radius: 8px; color: #D1D5DB; }
.ibtn:active { background: var(--bg); }
.favbtn.on { color: var(--warn); }
.empty { text-align: center; color: var(--gray); font-size: 14px; padding: 40px 0; }

.fccard { position: relative; background: #fff; border: 1px solid var(--border); border-radius: 20px; min-height: 280px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px 20px; cursor: pointer; user-select: none; box-shadow: 0 6px 20px rgba(37,99,235,.08); }
.fcctr { position: absolute; top: 14px; left: 16px; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 13px; color: var(--gray); }
#fcfavbtn { position: absolute; top: 8px; right: 10px; border: none; background: none; font-size: 24px; color: #D1D5DB; cursor: pointer; padding: 4px 6px; }
#fcfavbtn.on { color: var(--warn); }
#fcword { font-family: 'Nunito', sans-serif; font-size: 30px; font-weight: 900; text-align: center; word-break: break-word; }
#fcmean { display: none; margin-top: 16px; font-size: 18px; font-weight: 700; color: var(--primary); text-align: center; word-break: keep-all; }
#fctap { margin-top: 18px; font-size: 13px; color: var(--gray); }
.fcnav { display: flex; gap: 8px; margin-top: 14px; }
.fcbtn { flex: 1; padding: 14px 8px; border: none; border-radius: 12px; background: var(--primary); color: #fff; font-size: 15px; font-weight: 700; font-family: inherit; cursor: pointer; }
.fcbtn.sec { background: #fff; color: var(--primary); border: 1.5px solid var(--primary); }
.fchint { text-align: center; font-size: 12px; color: var(--gray); margin-top: 10px; }

.tbox { background: #fff; border: 1px solid var(--border); border-radius: 16px; padding: 18px; }
.tlabel { font-size: 13px; font-weight: 700; color: #374151; margin: 14px 0 8px; }

.tinput { width: 100%; padding: 12px 14px; border: 1.5px solid var(--border); border-radius: 12px; font-size: 15px; font-family: inherit; outline: none; }

.qcbtn { padding: 8px 16px; border-radius: 10px; border: 1.5px solid var(--primary); background: var(--primary); color: #fff; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 14px; }
.tnote { font-size: 12px; color: var(--gray); margin-top: 6px; }
.pbtn { width: 100%; padding: 15px; border: none; border-radius: 12px; background: var(--primary); color: #fff; font-size: 16px; font-weight: 700; font-family: inherit; cursor: pointer; margin-top: 16px; }

.tprog { height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; }
.tprogf { height: 100%; background: var(--primary); width: 0; transition: width .25s; }
.tmeta { display: flex; justify-content: space-between; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 13px; color: var(--gray); margin: 8px 0 14px; }

.tspk { margin-top: 10px; border: none; background: var(--primary-light); color: var(--primary); border-radius: 20px; padding: 6px 14px; font-size: 14px; cursor: pointer; }

<div class="app">
  <div class="hdr">

  </div>

      <span class="cnt" id="wcnt"></span>
    </div>
    <div id="wlist"></div>
  </div>

  <div class="pane" id="pane-fc">

    <div class="fccard" id="fccard">

      <div id="fcword"></div>
      <div id="fcmean"></div>
      <div id="fctap">탭해서 뜻 보기</div>
    </div>
    <div class="fcnav">
      <button class="fcbtn sec" onclick="fcPrev()">◀ 이전</button>
      <button class="fcbtn" style="background:var(--warn);" onclick="speakFc()">🔊</button>
      <button class="fcbtn" onclick="fcNext()">다음 ▶</button>
    </div>
    <div class="fchint">좌우로 밀어서 넘길 수 있어요</div>
  </div>

  <div class="pane" id="pane-t">
    <div id="tsetup"></div>
    <div id="trun" style="display:none;">
      <div class="tprog"><div class="tprogf" id="tprogf"></div></div>
      <div class="tmeta"><span id="tnum"></span><span class="ok" id="tok"></span></div>
      <div class="tq">
        <div class="tqword" id="tqword"></div>
        <div class="tqpho" id="tqpho"></div>
        <button class="tspk" onclick="tSpeak()">🔊 다시 듣기</button>
      </div>
      <div id="toptions"></div>
      <button class="pbtn" id="t-next-btn" onclick="tNext()">다음 →</button>
    </div>
    <div id="tresult" style="display:none;"></div>
  </div>
</div>

function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

function speak(t) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance(t);
  u.lang = 'en-US';
  u.rate = 0.85;
  window.speechSynthesis.speak(u);
}
function speakFc() { speak(document.getElementById('fcword').textContent); }

/* ---------- 저장 ---------- */
var ST = {};
try { ST = JSON.parse(localStorage.getItem(STORE_KEY) || '{}') || {}; } catch (e) { ST = {}; }
function saveST() { try { localStorage.setItem(STORE_KEY, JSON.stringify(ST)); } catch (e) {} }
function sk(w) { return w.word + '|' + w.meaning; }
function getS(w) { var s = ST[sk(w)]; return s ? s : {status:'', fav:false}; }
function setS(w, key, val) {
  var k = sk(w);
  if (!ST[k]) ST[k] = {status:'', fav:false};
  ST[k][key] = val;
  saveST();
}

/* ---------- 범위 ---------- */
function buildRanges(ws) {
  var r = [{label:'전체', s:0, e:ws.length}];
  for (var i = 0; i < ws.length; i += 50) {
    var e = Math.min(i + 50, ws.length);
    r.push({label:(i+1)+'~'+e, s:i, e:e});
  }
  return r;
}
var RANGES = buildRanges(rawWords);

function renderRangeBar(barId, ri, fn) {
  var bar = document.getElementById(barId);
  if (!bar) return;
  var h = [];
  for (var i = 0; i < RANGES.length; i++) {
    var cls = 'rbtn' + (i === ri ? ' on' : '');
    h.push('<button class="' + cls + '" data-i="' + i + '" onclick="' + fn + '(this)">' + RANGES[i].label + '</button>');
  }
  bar.innerHTML = h.join('');
}
function wordsForRange(ri) {
  var r = RANGES[ri];
  return rawWords.slice(r.s, r.e);
}

function shuffle(a) {
  var b = a.slice();
  for (var i = b.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = b[i]; b[i] = b[j]; b[j] = t;
  }
  return b;
}

  for (var i = 0; i < TABS.length; i++) {
    var t = TABS[i];

    document.getElementById('tb-' + t).classList.toggle('on', t === id);
  }
  if (id === 'w')  { renderRangeBar('wrbar', wri, 'setWR'); renderList(); }
  if (id === 'fc') { fcInit(); }

}

/* ---------- 탭1 단어목록 ---------- */
var wri = 0, wfilter = 'all';
function setWR(el) { wri = parseInt(el.getAttribute('data-i'), 10); renderList(); }
function setWF(f) {
  wfilter = f;
  var ids = ['all','unk','fav'];
  for (var i = 0; i < ids.length; i++) {
    document.getElementById('wf-' + ids[i]).classList.toggle('on', ids[i] === f);
  }
  renderList();
}
function renderList() {
  renderRangeBar('wrbar', wri, 'setWR');
  var pool = wordsForRange(wri);
  var q = document.getElementById('wsearch').value.replace(/^\s+|\s+$/g, '').toLowerCase();
  var list = [];
  for (var p = 0; p < pool.length; p++) {
    var pw = pool[p], ps = getS(pw);
    if (wfilter === 'unk' && ps.status === 'known') continue;
    if (wfilter === 'fav' && !ps.fav) continue;
    if (q && pw.word.toLowerCase().indexOf(q) < 0 && pw.meaning.toLowerCase().indexOf(q) < 0) continue;
    list.push(pw);
  }
  var h = [];
  for (var i = 0; i < list.length; i++) {
    var w = list[i], s = getS(w);
    var known = s.status === 'known', fav = s.fav;
    h.push('<div class="wcard' + (known ? ' known' : '') + '">');
    h.push('<button class="chk' + (known ? ' on' : '') + '" data-wi="' + i + '" onclick="toggleKnown(this)">' + (known ? '✔' : '') + '</button>');
    h.push('<div class="wbody">');
    h.push('<div class="wword">' + esc(w.word) + '</div>');
    h.push('<div class="wmean">' + esc(w.meaning) + '</div>');
    h.push('</div>');
    h.push('<div class="wacts">');
    h.push('<button class="ibtn" data-w="' + esc(w.word) + '" onclick="speak(this.dataset.w)">🔊</button>');
    h.push('<button class="ibtn favbtn' + (fav ? ' on' : '') + '" data-wi="' + i + '" onclick="toggleFav(this)">' + (fav ? '★' : '☆') + '</button>');
    h.push('</div>');
    h.push('</div>');
  }
  if (!list.length) h.push('<div class="empty">표시할 단어가 없어요</div>');
  document.getElementById('wlist').innerHTML = h.join('');
  document.getElementById('wcnt').textContent = list.length + '개';
  window._wlist = list;
}
function toggleKnown(el) {
  var w = window._wlist[parseInt(el.getAttribute('data-wi'), 10)];
  if (!w) return;
  setS(w, 'status', getS(w).status === 'known' ? '' : 'known');
  renderList();
}
function toggleFav(el) {
  var w = window._wlist[parseInt(el.getAttribute('data-wi'), 10)];
  if (!w) return;
  setS(w, 'fav', !getS(w).fav);
  renderList();
}

/* ---------- 탭2 플래시카드 ---------- */
var fri = 0, fcPool = [], fcIdx = 0, fcFlipped = false, fcTX = 0;
function setFCR(el) { fri = parseInt(el.getAttribute('data-i'), 10); fcIdx = 0; fcInit(); }
var fcEvReg = false;
function fcRegisterEvents() {
  if (fcEvReg) return;
  fcEvReg = true;
  var card = document.getElementById('fccard');
  card.addEventListener('click', function(e) {
    if (e.target.id === 'fcfavbtn') return;
    fcFlip();
  });
  card.addEventListener('touchstart', function(e) {
    fcTX = e.touches[0].clientX;
  }, {passive:true});
  card.addEventListener('touchend', function(e) {
    var dx = e.changedTouches[0].clientX - fcTX;
    if (Math.abs(dx) > 50) { if (dx < 0) fcNext(); else fcPrev(); }
  }, {passive:true});
}
function fcInit() {
  renderRangeBar('fcrbar', fri, 'setFCR');
  fcPool = wordsForRange(fri);
  if (fcIdx >= fcPool.length) fcIdx = 0;
  fcRegisterEvents();
  fcShow();
}
function fcShow() {
  if (!fcPool.length) return;
  fcFlipped = false;
  var w = fcPool[fcIdx];
  document.getElementById('fcword').textContent = w.word;
  document.getElementById('fcmean').textContent = w.meaning;
  document.getElementById('fcmean').style.display = 'none';
  document.getElementById('fctap').style.display = 'block';
  document.getElementById('fcctr').textContent = (fcIdx+1) + '/' + fcPool.length;
  var fb = document.getElementById('fcfavbtn');
  var fav = getS(w).fav;
  fb.textContent = fav ? '★' : '☆';
  fb.className = fav ? 'on' : '';
}
function fcFlip() {
  if (fcFlipped) return;
  if (!fcPool.length) return;
  fcFlipped = true;
  document.getElementById('fcmean').style.display = 'block';
  document.getElementById('fctap').style.display = 'none';
  speak(fcPool[fcIdx].word);
}
function fcNext() { if (!fcPool.length) return; fcIdx = (fcIdx + 1) % fcPool.length; fcShow(); }
function fcPrev() { if (!fcPool.length) return; fcIdx = (fcIdx - 1 + fcPool.length) % fcPool.length; fcShow(); }
function fcToggleFav() {
  if (!fcPool.length) return;
  var w = fcPool[fcIdx];
  setS(w, 'fav', !getS(w).fav);
  var fav = getS(w).fav;
  var fb = document.getElementById('fcfavbtn');
  fb.textContent = fav ? '★' : '☆';
  fb.className = fav ? 'on' : '';
}

  tName = nm;
  var pool = wordsForRange(tri);
  if (!pool.length) { alert('이 범위에는 단어가 없어요.'); return; }
  tQs = shuffle(pool).slice(0, T_COUNT);
  tIdx = 0; tCorrect = 0; tResults = [];
  tShowScreen('run');
  tRender();
}
function tBuildOptions(w) {
  var seen = {};
  seen[w.meaning] = true;
  var wrongs = [];
  var cand = shuffle(rawWords);
  for (var i = 0; i < cand.length && wrongs.length < 3; i++) {
    var m = cand[i].meaning;
    if (seen[m]) continue;
    seen[m] = true;
    wrongs.push(m);
  }
  wrongs.push(w.meaning);
  return shuffle(wrongs);
}
function tRender() {
  tLocked = false;
  var w = tQs[tIdx];
  var total = tQs.length;
  document.getElementById('tprogf').style.width = Math.round(tIdx / total * 100) + '%';
  document.getElementById('tnum').textContent = (tIdx + 1) + ' / ' + total;
  document.getElementById('tok').textContent = '✔ ' + tCorrect;
  document.getElementById('tqword').textContent = w.word;
  document.getElementById('tqpho').textContent = w.phonetic ? w.phonetic : '';
  tOpts = tBuildOptions(w);
  var h = [];
  for (var i = 0; i < tOpts.length; i++) {
    h.push('<button class="topt" data-oi="' + i + '" onclick="tPick(this)">' + esc(tOpts[i]) + '</button>');
  }
  document.getElementById('toptions').innerHTML = h.join('');
  var nb = document.getElementById('t-next-btn');
  nb.style.display = 'none';
  nb.textContent = (tIdx === total - 1) ? '결과 보기 →' : '다음 →';
  speak(w.word);
}
function tSpeak() { if (tQs[tIdx]) speak(tQs[tIdx].word); }
function tPick(el) {
  var oi = parseInt(el.getAttribute('data-oi'), 10);
  tAnswer(el, tOpts[oi], tQs[tIdx].meaning);
}
function tAnswer(el, chosen, correct) {
  if (tLocked) return;
  tLocked = true;
  var opts = document.querySelectorAll('#toptions .topt');
  for (var i = 0; i < opts.length; i++) {
    var b = opts[i];
    var bv = tOpts[parseInt(b.getAttribute('data-oi'), 10)];
    if (bv === correct) b.className += ' correct';
    else if (b === el) b.className += ' wrong';
    b.style.pointerEvents = 'none';
  }
  var ok = (chosen === correct);
  if (ok) tCorrect++;
  tResults.push({word: tQs[tIdx].word, meaning: correct, ans: chosen, ok: ok});
  document.getElementById('tok').textContent = '✔ ' + tCorrect;
  document.getElementById('t-next-btn').style.display = 'block';
}
function tNext() {
  if (!tLocked) return;
  tIdx++;
  if (tIdx >= tQs.length) { tShowResult(); return; }
  tRender();
}
function tDateStr() {
  var d = new Date();
  return d.getFullYear() + '. ' + (d.getMonth() + 1) + '. ' + d.getDate() + '.';
}
function tShowResult() {
  var total = tQs.length;
  var pct = Math.round(tCorrect / total * 100);
  var emo = pct === 100 ? '🏆' : (pct >= 80 ? '🎉' : (pct >= 60 ? '👍' : '💪'));
  var wrong = [], right = [];
  for (var i = 0; i < tResults.length; i++) {
    if (tResults[i].ok) right.push(tResults[i]); else wrong.push(tResults[i]);
  }
  var h = [];
  h.push('<div class="tbox">');
  h.push('<div class="rscore">');
  h.push('<div class="remoji">' + emo + '</div>');
  h.push('<div class="rnum">' + tCorrect + '/' + total + '</div>');
  h.push('<div class="rpct">' + pct + '점</div>');
  h.push('<div class="rname">' + esc(tName) + ' · ' + tDateStr() + '</div>');
  h.push('</div>');
  if (wrong.length) {
    h.push('<div class="rsec">❌ 틀린 단어 (' + wrong.length + '개)</div>');
    for (var j = 0; j < wrong.length; j++) {
      var r = wrong[j];
      h.push('<div class="ritem"><b>' + esc(r.word) + '</b><br>');
      h.push('<span class="ans">입력: ' + esc(r.ans) + '</span><br>');
      h.push('<span class="cor">정답: ' + esc(r.meaning) + '</span></div>');
    }
  } else {
    h.push('<div class="rsec">모든 문제를 맞혔어요!</div>');
  }
  if (right.length) {
    var rw = [];
    for (var k = 0; k < right.length; k++) rw.push(esc(right[k].word));
    h.push('<div class="rsec">✅ 맞은 단어 (' + right.length + '개)</div>');
    h.push('<div class="rok">' + rw.join(', ') + '</div>');
  }
  h.push('<button class="pbtn kbtn" onclick="tCopy()">📋 카톡으로 결과 복사</button>');
  h.push('<button class="pbtn sbtn" onclick="tSetup()">↩ 다시 테스트</button>');
  h.push('</div>');
  document.getElementById('tresult').innerHTML = h.join('');
  document.getElementById('tprogf').style.width = '100%';
  tShowScreen('result');
  window.scrollTo(0, 0);
}
function tCopyText() {
  var total = tQs.length;
  var pct = Math.round(tCorrect / total * 100);
  var wrong = [], right = [];
  for (var i = 0; i < tResults.length; i++) {
    if (tResults[i].ok) right.push(tResults[i].word); else wrong.push(tResults[i]);
  }
  var L = [];
  L.push('[씨유에탑 ' + SERIES + '] 테스트 결과');
  L.push('날짜: ' + tDateStr());
  L.push('이름: ' + tName);
  L.push('점수: ' + tCorrect + '/' + total + ' (' + pct + '점)');
  L.push('─────────────────');
  L.push('❌ 틀린 단어 (' + wrong.length + '개)');
  for (var j = 0; j < wrong.length; j++) {
    L.push('  ' + wrong[j].word + ' → 입력:' + wrong[j].ans + ' / 정답:' + wrong[j].meaning);
  }
  L.push('─────────────────');
  L.push('✅ 맞은 단어: ' + right.join(', '));
  return L.join('\n');
}
function tCopyFallback(txt) {
  var ta = document.createElement('textarea');
  ta.value = txt;
  ta.setAttribute('readonly', 'readonly');
  ta.style.position = 'fixed';
  ta.style.top = '0';
  ta.style.left = '0';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  try { ta.setSelectionRange(0, txt.length); } catch (e) {}
  var ok = false;
  try { ok = document.execCommand('copy'); } catch (e2) { ok = false; }
  document.body.removeChild(ta);
  if (ok) alert('결과가 복사되었어요. 카톡에 붙여넣기 하세요!');
  else prompt('아래 내용을 길게 눌러 복사하세요.', txt);
}
function tCopy() {
  var txt = tCopyText();
  if (navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext) {
    navigator.clipboard.writeText(txt).then(function() {
      alert('결과가 복사되었어요. 카톡에 붙여넣기 하세요!');
    }, function() { tCopyFallback(txt); });
  } else {
    tCopyFallback(txt);
  }
}

/* ---------- 시작 ---------- */
renderList();
</script>
